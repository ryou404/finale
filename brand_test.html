    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- 核心樣式 --- */
        :root { --primary: #2563eb; --text-main: #0f172a; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f8fafc; color: var(--text-main); }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08); }
        .gradient-text { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-bg { background-image: radial-gradient(circle at 50% 0%, #eff6ff 0%, transparent 70%), radial-gradient(circle at 100% 100%, #dbeafe 0%, transparent 50%); }
        .fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        .likert-opt input:checked + div { background-color: var(--primary); color: white; border-color: var(--primary); transform: scale(1.05); box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); }
        .circular-chart { display: block; margin: 0 auto; max-width: 100%; max-height: 250px; }
        .circle-bg { fill: none; stroke: #e2e8f0; stroke-width: 2.5; }
        .circle { fill: none; stroke-width: 2.5; stroke-linecap: round; transition: stroke-dasharray 1s ease-out; }
        .hidden { display: none !important; }
        .tab-btn.active { border-bottom: 2px solid var(--primary); color: var(--primary); font-weight: 700; }

        /* --- Dark Mode --- */
        body.dark-mode { background-color: #0f172a; color: #f1f5f9; }
        body.dark-mode .hero-bg { background-image: none; }
        body.dark-mode .glass-panel { background: rgba(30, 41, 59, 0.9); border-color: rgba(255,255,255,0.1); }
        body.dark-mode .text-slate-900 { color: #f8fafc; }
        body.dark-mode .text-slate-800 { color: #f1f5f9; }
        body.dark-mode .text-slate-700 { color: #e2e8f0; }
        body.dark-mode .text-slate-600 { color: #cbd5e1; }
        body.dark-mode .text-slate-500 { color: #94a3b8; }
        body.dark-mode .text-slate-400 { color: #64748b; }
        body.dark-mode .bg-white { background-color: #1e293b; }
        body.dark-mode .bg-slate-50 { background-color: #334155; }
        body.dark-mode .border-slate-100 { border-color: #334155; }
        body.dark-mode .border-slate-50 { border-color: #334155; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .glass-panel { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>

            {t:'我重視細節與精確度，在執行任務時會嚴格遵守規範與品質標準。(C)', m:'C', cat:'h'},
            {t:'我會主動參加技術研討會或閱讀論文，以保持在專業領域的領先地位。(I)', m:'I', cat:'h'},
            {t:'我享受在公開場合演講或進行簡報，展現個人或團隊的成果。(E)', m:'E', cat:'h'},
            {t:'我無法忍受流程混亂或效率低下的工作方式，會主動尋求優化與標準化。(C)', m:'C', cat:'h'}
        ];

        window.app = {
            state: { answers: {}, currentPage: 0, pageSize: 5 },
            start() { this.state = { answers: {}, currentPage: 0, pageSize: 5 }; this.switchView('view-quiz'); this.renderQuiz(); window.scrollTo(0,0); },
            loadDemo() { QUESTIONS.forEach((q, i) => this.state.answers[i] = Math.floor(Math.random() * 3) + 3); this.calculateResults(); },
            switchView(id) { ['view-landing', 'view-quiz', 'view-result'].forEach(v => document.getElementById(v).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); },
            
            loadLastReport() {
                if (this.state.lastReport) {
                    this.switchView('view-result');
                    this.renderReportView(this.state.lastReport);
                }
            },
            
            renderQuiz() {
                const { currentPage, pageSize } = this.state;
                const start = currentPage * pageSize;
                const end = start + pageSize;
                const pageQs = QUESTIONS.slice(start, end);
                const answeredCount = Object.keys(this.state.answers).length;
                const progress = Math.min(100, Math.floor((answeredCount / QUESTIONS.length) * 100));
                document.getElementById('progress-bar').style.width = `${progress}%`;
                document.getElementById('progress-text').innerText = `${progress}%`;
                let html = '';
                pageQs.forEach((q, i) => {
                    const idx = start + i;
                    const val = this.state.answers[idx] || 0;
                    html += `<div class="mb-8 p-6 bg-white rounded-2xl border border-slate-100 shadow-sm fade-in-up" style="animation-delay:${i*0.1}s">
                        <h3 class="font-bold text-lg text-slate-800 mb-4">${idx+1}. ${q.t}</h3>
                        <div class="flex justify-between gap-2">${[1,2,3,4,5].map(v => `<label class="likert-opt flex-1 cursor-pointer group"><input type="radio" name="q${idx}" value="${v}" ${val==v?'checked':''} class="hidden" onchange="window.app.answer(${idx}, ${v})"><div class="h-12 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-center text-slate-400 font-bold transition-all group-hover:border-blue-300">${v}</div></label>`).join('')}</div>
                        <div class="flex justify-between text-xs text-slate-400 mt-2 px-1"><span>不符合 (1)</span><span>非常符合 (5)</span></div></div>`;
                });
                document.getElementById('quiz-container').innerHTML = html;
                document.getElementById('btn-prev').disabled = currentPage === 0;
                document.getElementById('btn-next').innerText = (end >= QUESTIONS.length) ? '查看報告' : '下一頁';
            },

            answer(idx, val) { this.state.answers[idx] = val; this.renderQuiz(); },
            prevPage() { if(this.state.currentPage > 0) { this.state.currentPage--; this.renderQuiz(); window.scrollTo(0,0); } },
            nextPage() {
                const { currentPage, pageSize } = this.state;
                const start = currentPage * pageSize;
                const end = Math.min(start + pageSize, QUESTIONS.length);
                for(let i=start; i<end; i++) { if(!this.state.answers[i]) { alert(`請完成第 ${i+1} 題`); return; } }
                if(end >= QUESTIONS.length) this.calculateResults(); else { this.state.currentPage++; this.renderQuiz(); window.scrollTo(0,0); }
            },

            async calculateResults() {
                this.switchView('view-result');

                let sScores = {}, hScores = {};
                QUESTIONS.forEach((q, i) => {
                    const val = this.state.answers[i] || 3;
                    if(q.cat === 's') sScores[q.m] = (sScores[q.m] || 0) + val; else hScores[q.m] = (hScores[q.m] || 0) + val;
                });

                const topH = Object.entries(hScores).sort((a,b)=>b[1]-a[1]);
                const topHollandCode = topH[0][0];
                const topHollandScore = topH[0][1];
                const maxPossibleScore = QUESTIONS.filter(q => q.m === topHollandCode && q.cat === 'h').length * 5;
                const fitScore = maxPossibleScore > 0 ? Math.round((topHollandScore / maxPossibleScore) * 100) : 0;

                const hCode = topH.slice(0,3).map(x=>x[0]).join('');
                const topS = Object.entries(sScores).sort((a,b)=>b[1]-a[1]).slice(0,5);

                let radarData = DATA.radarMap.map(dim => {
                    let sum = 0, count = 0;
                    dim.keys.forEach(k => { sum += (k.length > 1 ? (sScores[k]||0) : (hScores[k]||0)); count += QUESTIONS.filter(q => q.m === k).length; });
                    return (count > 0) ? Math.round((sum / (count*5)) * 100) : 0;
                });
                
                const resultData = {
                    date: new Date().toISOString(),
                    topHollandCode: topHollandCode,
                    fitScore: fitScore,
                    hollandCode: hCode,
                    topStrengths: topS.map(s => s[0]),
                    radarData: radarData,
                    hollandScores: topH
                };

                if (currentUser) {
                    try {
                        const batch = writeBatch(db);
                        
                        // 1. 保存歷史快照 (History Logging) - 自動產生 ID
                        const historyRef = doc(collection(db, "users", currentUser.uid, "history_brand"));
                        batch.set(historyRef, resultData);

                        // 2. 更新聚合快取 (Summary Cache)
                        const userRef = doc(db, "users", currentUser.uid);
                        batch.set(userRef, {
                            summary_cache: {
                                brand: {
                                    date: resultData.date,
                                    topHollandCode: resultData.topHollandCode,
                                    fitScore: resultData.fitScore,
                                    topStrengths: resultData.topStrengths
                                }
                            }
                        }, { merge: true });

                        await batch.commit();
                        this.state.lastReport = resultData; // Update local state
                        console.log("✅ 測驗結果已同步至雲端 (歷史快照 + 聚合快取)！");
                    } catch (e) {
                        console.error("❌ 儲存失敗", e);
                    }
                } else {
                    console.log("⚠️ 未登入，僅顯示結果");
                }
                
                this.renderReportView(resultData);
            },

            renderReportView(data) {
                window.scrollTo(0,0);
                const { topHollandCode, fitScore, hollandCode, topStrengths, radarData, hollandScores, date } = data;
                
                // Handle date
                document.getElementById('report-date').innerText = date ? new Date(date).toLocaleDateString('zh-TW') : new Date().toLocaleDateString('zh-TW');

                const roleInfo = DATA.roles[topHollandCode];
                document.getElementById('best-dept').innerText = roleInfo.jobs.join(' / ');
                document.getElementById('archetype-desc').innerText = roleInfo.stat;
                
                document.getElementById('fit-score-text').innerText = fitScore + '%';
                const circle = document.querySelector('.circle');
                circle.style.stroke = fitScore >= 80 ? '#2563eb' : (fitScore >= 60 ? '#f59e0b' : '#64748b');
                setTimeout(() => {
                    circle.style.strokeDasharray = `${fitScore || 0}, 100`;
                    let start = 0;
                    const timer = setInterval(() => { start++; document.getElementById('score-display').innerText = start; if(start >= fitScore) { clearInterval(timer); document.getElementById('score-display').innerText = fitScore; } }, 10);
                }, 100);

                this.drawRadar(radarData);

                document.getElementById('holland-code').innerText = hollandCode;
                
                // Handle Holland Bars (data.hollandScores might be missing in old data, fallback needed)
                const hScoresToRender = hollandScores || hollandCode.split('').map(c => [c, 10]); // Fallback
                const maxHScore = hScoresToRender[0] ? hScoresToRender[0][1] : 1;

                document.getElementById('holland-bars').innerHTML = hScoresToRender.map(h => {
                    const info = DATA.hollandInfo[h[0]], pct = Math.max(0, (h[1]/maxHScore)*100);
                    return `<div class="flex items-center text-sm"><span class="w-8 font-bold" style="color:${info.c}">${h[0]}</span><div class="flex-1 h-2 bg-slate-100 dark:bg-slate-700 rounded-full mx-2 overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%; background:${info.c}"></div></div><span class="w-6 text-right text-slate-400 dark:text-slate-500">${h[1]}</span></div>`;
                }).join('');

                document.getElementById('strength-cards').innerHTML = topStrengths.map((s,i) => `<div class="p-3 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-slate-100 dark:border-slate-700 flex items-center justify-between"><span class="font-bold text-slate-700 dark:text-slate-200">#${i+1} ${DATA.strengthsInfo[s]}</span><span class="text-xs bg-white dark:bg-slate-800 px-2 py-1 rounded text-slate-400 dark:text-slate-500 font-mono">${s}</span></div>`).join('');

                let radarDetailsHTML = '';
                radarData.forEach((score, i) => {
                    const dim = DATA.radarMap[i];
                    let meaning = score < 50 ? DATA.radarBenchmarks[dim.name].low : (score < 75 ? DATA.radarBenchmarks[dim.name].mid : DATA.radarBenchmarks[dim.name].high);
                    let color = score >= 75 ? 'text-green-600' : (score >= 50 ? 'text-blue-600' : 'text-slate-500');
                    radarDetailsHTML += `<div class="flex items-start justify-between border-b border-slate-50 dark:border-slate-700 pb-2 last:border-0"><div class="w-1/3"><span class="block font-bold text-slate-700 dark:text-slate-200 text-sm">${dim.name}</span><span class="text-2xl font-black ${color}">${score}</span><span class="text-xs text-slate-400 dark:text-slate-500">/100</span></div><div class="w-2/3 pl-4 border-l border-slate-100 dark:border-slate-700"><p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">${meaning}</p></div></div>`;
                });
                document.getElementById('radar-details').innerHTML = radarDetailsHTML;

                const platformInfo = DATA.platforms[hollandCode[0]];
                document.getElementById('platform-card').innerHTML = `
                    <div class="mb-3">
                        <h4 class="font-bold text-pink-800 dark:text-pink-300 text-lg flex items-center gap-2">
                            ${platformInfo.name}
                            <span class="text-xs bg-pink-200 dark:bg-pink-900/50 text-pink-800 dark:text-pink-300 px-2 py-0.5 rounded-full">${platformInfo.role}</span>
                        </h4>
                        <p class="text-sm text-slate-600 dark:text-slate-400 mt-2 font-medium leading-relaxed">${platformInfo.strategy}</p>
                    </div>
                    
                    <div class="space-y-3">
                        <div class="bg-white dark:bg-slate-900/50 p-3 rounded-lg border border-pink-100 dark:border-slate-700 shadow-sm">
                            <div class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase mb-1">Bio 範本 (個人簡介)</div>
                            <p class="text-sm text-slate-800 dark:text-slate-300 font-mono bg-slate-50 dark:bg-slate-800 p-2 rounded select-all cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="點擊複製" onclick="navigator.clipboard.writeText(this.innerText);alert('已複製 Bio！')">${platformInfo.bio}</p>
                        </div>
                        
                        <div class="bg-white dark:bg-slate-900/50 p-3 rounded-lg border border-pink-100 dark:border-slate-700 shadow-sm">
                            <div class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase mb-1">Content Ideas (貼文靈感)</div>
                            <ul class="text-sm text-slate-700 dark:text-slate-400 space-y-1 list-disc list-inside">
                                ${platformInfo.content.map(c => `<li>${c}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `;

                const actionInfo = DATA.actionCards[topStrengths[0]];
                document.getElementById('action-card-content').innerHTML = `
                    <div class="grid grid-cols-1 gap-2">
                        <div class="bg-white dark:bg-slate-900/50 p-2 rounded border border-yellow-100 dark:border-slate-700"><span class="text-xs font-bold text-slate-400 dark:text-slate-500 block">📚 推薦書籍</span><span class="text-sm font-medium text-slate-800 dark:text-slate-300">${actionInfo.book}</span></div>
                        <div class="bg-white dark:bg-slate-900/50 p-2 rounded border border-yellow-100 dark:border-slate-700"><span class="text-xs font-bold text-slate-400 dark:text-slate-500 block">🛠️ 必修技能</span><span class="text-sm font-medium text-slate-800 dark:text-slate-300">${actionInfo.skill}</span></div>
                        <div class="bg-yellow-100 dark:bg-yellow-900/30 p-3 rounded border border-yellow-200 dark:border-yellow-800/50 mt-1">
                            <span class="text-xs font-bold text-yellow-700 dark:text-yellow-300 block mb-1">⚡ 今日微行動 (Micro-Action)</span>
                            <span class="text-sm font-bold text-yellow-900 dark:text-yellow-200">${actionInfo.task}</span>
                        </div>
                    </div>
                `;

                // 渲染 30/60/90 天計畫
                const planData = roleInfo.plan;
                document.getElementById('action-plan-timeline').innerHTML = planData.map(p => `
                    <div class="flex gap-4 items-start">
                        <div class="w-24 flex-shrink-0 text-xs font-bold text-blue-600 dark:text-blue-300 bg-blue-50 dark:bg-blue-900/30 px-2 py-1 rounded text-center border border-blue-100 dark:border-blue-800/50">${p.d}</div>
                        <div><h5 class="text-sm font-bold text-slate-800 dark:text-slate-200">${p.t}</h5><p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">${p.c}</p></div>
                    </div>
                `).join('');

                // 填充 AI 互動區塊
                document.getElementById('resume-draft').innerText = roleInfo.resumeHighlight;
                document.getElementById('interview-question').innerText = roleInfo.interviewQuestion;
            },

            drawRadar(data) {
                const svg = document.getElementById('radar-chart');
                const center = 150, radius = 100, angles = [0, 60, 120, 180, 240, 300].map(a => (a-90) * Math.PI / 180);
                
                const isDarkMode = document.body.classList.contains('dark-mode');
                const gridColor = isDarkMode ? '#334155' : '#e2e8f0';
                const textColor = isDarkMode ? '#94a3b8' : '#64748b';
                const areaFillColor = isDarkMode ? 'rgba(96, 165, 250, 0.2)' : 'rgba(37, 99, 235, 0.2)';
                const strokeColor = isDarkMode ? '#60a5fa' : '#2563eb';

                let gridHTML = '';
                [0.2, 0.4, 0.6, 0.8, 1].forEach(scale => { const points = angles.map(a => `${center + radius * scale * Math.cos(a)},${center + radius * scale * Math.sin(a)}`).join(' '); gridHTML += `<polygon points="${points}" fill="none" stroke="${gridColor}" stroke-width="1"/>`; });
                angles.forEach((a, i) => {
                    const x = center + radius * 1.25 * Math.cos(a), y = center + radius * 1.25 * Math.sin(a);
                    gridHTML += `<line x1="${center}" y1="${center}" x2="${center + radius * Math.cos(a)}" y2="${center + radius * Math.sin(a)}" stroke="${gridColor}" /><text x="${x}" y="${y}" fill="${textColor}" font-size="12" text-anchor="${Math.cos(a)>0.1?'start':(Math.cos(a)<-0.1?'end':'middle')}" dominant-baseline="middle">${DATA.radarMap[i].name}</text>`;
                });
                const dataPoints = angles.map((a, i) => `${center + radius * (data[i]/100) * Math.cos(a)},${center + radius * (data[i]/100) * Math.sin(a)}`).join(' ');
                svg.innerHTML = gridHTML + `<polygon points="${dataPoints}" fill="${areaFillColor}" stroke="${strokeColor}" stroke-width="3" />` + angles.map((a, i) => `<circle cx="${center + radius * (data[i]/100) * Math.cos(a)}" cy="${center + radius * (data[i]/100) * Math.sin(a)}" r="4" fill="${strokeColor}"/>`).join('');
            },

            downloadPDF() {
                const element = document.getElementById('report-container');
                const opt = { margin: 10, filename: 'CareerDNA_Report.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
                html2pdf().set(opt).from(element).save();
            },

            toggleAISection(section) {
                const el = document.getElementById(`ai-section-${section}`);
                const btn = el.previousElementSibling;
                const icon = btn.querySelector('svg');
                const isHidden = el.classList.contains('hidden');
                
                // Close all sections first
                document.getElementById('ai-section-resume').classList.add('hidden');
                document.getElementById('ai-section-interview').classList.add('hidden');
                document.querySelector('#ai-section-resume').previousElementSibling.querySelector('svg').classList.remove('rotate-180');
                document.querySelector('#ai-section-interview').previousElementSibling.querySelector('svg').classList.remove('rotate-180');

                if (isHidden) {
                    el.classList.remove('hidden');
                    icon.classList.add('rotate-180');
                }
            },

            copyText(id, isP = false) {
                const text = document.getElementById(id)[isP ? 'innerText' : 'textContent'];
                navigator.clipboard.writeText(text).then(() => alert('已複製內容！')).catch(err => console.error('Copy failed', err));
            }
        };
    </script>
</body>
</html>
