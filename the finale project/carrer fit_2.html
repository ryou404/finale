<!DOCTYPE html>
<html lang="zh-TW">

        .course-card.selected { border-color: #3b82f6; background-color: #eff6ff; ring: 2px solid #3b82f6; }
        .hidden-checkbox { display: none; }
        
        @keyframes dash {
            from { stroke-dashoffset: 251.2; }
            to { stroke-dashoffset: var(--target-dash); }
        }
        
        /* 自定義捲軸 - 提升質感 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }

<body class="text-slate-800 min-h-screen flex flex-col">

                </h1>
            </div>
            <div class="flex gap-2">
                <button onclick="App.reset()" class="text-sm text-slate-500 font-bold hover:bg-slate-100 px-4 py-2 rounded-lg transition">重置</button>

        </div>
    </header>

    <div class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">

                <h2 class="text-lg font-bold text-slate-800 mb-5 flex items-center gap-2 relative z-10">
                    <span class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center text-sm">01</span> 
                    學籍定位
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 relative z-10">

                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">系所</label>

                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">年級</label>
                        <select id="gradeSelect" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none bg-white font-medium text-slate-700 cursor-pointer">
                            <option value="1">一年級</option>
                            <option value="2">二年級</option>

                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">班級</label>

                            <option value="B">B 班</option>

                        "B": [{n:"英文(二)",t:"必修",c:2,p:"唐嘉憶"},{n:"離散數學",t:"必修",c:3,p:"楊孟蒨"},{n:"計算機概論(二)",t:"必修",c:2,p:"胡學誠"},{n:"進階程式設計",t:"必修",c:3,p:"劉國有"},{n:"資訊數學",t:"必修",c:3,p:"陳智賢"},{n:"色彩學",t:"選修",c:3,p:"王肇"},{n:"遊戲企劃",t:"選修",c:3,p:"王岱伊"},{n:"素描",t:"選修",c:2,p:"林康琦"}]
                    },
                    "2": {
                        "A": [{n:"機率與統計",t:"必修",c:3,p:"莊潤洲"},{n:"生涯規劃及職場倫理",t:"必修",c:1,p:"王肇/許慈芳"},{n:"數位作品實作(一)",t:"必修",c:1,p:"鄧佩珊/許慈芳"},{n:"動態網頁設計",t:"選修",c:3,p:"胡學誠"},{n:"視覺傳達",t:"選修",c:3,p:"鄧佩珊"},{n:"基礎日文(二)",t:"選修",c:3,p:"卓美幸"},{n:"藝術視覺心理學",t:"選修",c:2,p:"王肇"},{n:"3D遊戲設計",t:"選修",c:3,p:"吳賦哲"},{n:"數位特效與影像美學",t:"選修",c:3,p:"王肇"},{n:"音樂初階實作",t:"選修",c:3,p:"彭宇薰"}],
                        "B": [{n:"機率與統計",t:"必修",c:3,p:"莊潤洲"},{n:"生涯規劃及職場倫理",t:"必修",c:1,p:"王肇/許慈芳"},{n:"數位作品實作(一)",t:"必修",c:1,p:"吳賦哲/王肇"},{n:"動態網頁設計",t:"選修",c:3,p:"胡學誠"},{n:"視覺傳達",t:"選修",c:3,p:"鄧佩珊"},{n:"基礎日文(二)",t:"選修",c:3,p:"卓美幸"},{n:"藝術視覺心理學",t:"選修",c:2,p:"王肇"},{n:"3D遊戲設計",t:"選修",c:3,p:"吳賦哲"},{n:"數位特效與影像美學",t:"選修",c:3,p:"王肇"},{n:"音樂初階實作",t:"選修",c:3,p:"彭宇薰"}]
                    },
                    "3": {
                        "A": [{n:"作業系統(合授)",t:"必修",c:3,p:"林峻安/劉國有"},{n:"專案實作(一)",t:"必修",c:2,p:"鄧佩珊/陳智賢"},{n:"演算法概論",t:"必修",c:3,p:"蔡英德"},{n:"組合數學",t:"選修",c:3,p:"楊孟蒨"},{n:"資料庫管理",t:"選修",c:3,p:"許慈芳"},{n:"網路系統建構實務",t:"選修",c:3,p:"許慈芳"},{n:"深度學習",t:"選修",c:3,p:"陳文敬"},{n:"軟體開發與維運",t:"選修",c:3,p:"吳賦哲"},{n:"科技互動藝術",t:"選修",c:3,p:"陳文敬/鄧佩珊"},{n:"虛擬實境體感開發",t:"選修",c:3,p:"陳智賢"},{n:"進階資訊日文",t:"選修",c:3,p:"蔡季汝"},{n:"生成式人工智慧",t:"選修",c:3,p:"吳賦哲"},{n:"數位美學應用",t:"選修",c:3,p:"鄧佩珊"}]
                    },
                    "4": {
                        "A": [{n:"網路系統建構實務",t:"選修",c:3,p:"許慈芳"},{n:"企業實習(三)",t:"選修",c:9,p:"羅峻旗"},{n:"深度學習",t:"選修",c:3,p:"陳文敬"},{n:"企業實習(四)",t:"選修",c:6,p:"陳智賢"},{n:"軟體開發與維運",t:"選修",c:3,p:"吳賦哲"},{n:"虛擬實境體感開發",t:"選修",c:3,p:"陳智賢"},{n:"生成式人工智慧",t:"選修",c:3,p:"吳賦哲"},{n:"AI數位媒體行銷",t:"選修",c:2,p:"陳正榮"},{n:"數位美學應用",t:"選修",c:3,p:"鄧佩珊"}]
                    }
                }
            }
        };

        const TRAITS = {
            "IM": { focus: "商業與管理", holland: ['C','E','I'], jobs: ["PM 產品經理", "SA 系統分析師", "MIS 工程師"] },
            "CS": { focus: "技術與演算法", holland: ['I','R','C'], jobs: ["後端工程師", "嵌入式工程師", "資安專家"] },
            "AI": { focus: "模型與互動科技", holland: ['I','A','R'], jobs: ["AI 演算法工程師", "互動科技研發", "資料科學家"] }
        };

        const EXP_OPTS = [
            {id:'contest', l:'🏆 校外競賽獲獎'}, {id:'leader', l:'👥 社團/系學會幹部'}, {id:'intern', l:'💼 企業實習(2個月+)'},
            {id:'project', l:'💻 Side Project'}, {id:'paper', l:'📄 研討會論文發表'}
        ];
        const CERT_OPTS = [
            {id:'en', l:'🇬🇧 多益 850+ / 托福'}, {id:'jp', l:'🇯🇵 日檢 N2 以上'}, 
            {id:'cloud', l:'☁️ AWS/GCP 證照'}, {id:'dev', l:'🛠️ 乙級證照 / iPAS'}
        ];

        // ----------------------------------------
        // 2. 應用程式邏輯 (App Logic)
        // ----------------------------------------
        const App = {
            state: { dept: "IM", grade: "4", cls: "A", courses: new Set(), exp: new Set(), chart: null },

            init() {
                this.renderSelectors();
                this.renderChips();
                this.bindEvents();
                this.loadUser();
                setTimeout(() => this.renderCourses(), 100);
            },

            renderSelectors() {
                const deptSel = document.getElementById('deptSelect');
                deptSel.innerHTML = Object.entries(COURSE_DB).map(([k,v]) => `<option value="${k}">${v.name}</option>`).join('');
                deptSel.value = "IM"; 
            },

            renderChips() {
                const mk = (list, type) => list.map(i => `
                    <label class="cursor-pointer select-none group">
                        <input type="checkbox" value="${i.id}" class="hidden-checkbox" onchange="App.toggleChip(this, '${type}')">
                        <div class="px-3 py-2 rounded-lg border border-slate-200 bg-white text-xs font-bold text-slate-500 transition group-hover:border-blue-300 peer-checked:bg-blue-600 peer-checked:text-white peer-checked:border-blue-600 shadow-sm">
                            ${i.l}
                        </div>
                    </label>`).join('');
                document.getElementById('exp-chips').innerHTML = mk(EXP_OPTS, 'exp');
                document.getElementById('cert-chips').innerHTML = mk(CERT_OPTS, 'cert');
                
                const codes = ['R','I','A','S','E','C'];
                document.getElementById('holland-chips').innerHTML = codes.map(c => `
                    <label class="cursor-pointer select-none">
                        <input type="checkbox" value="${c}" class="hidden-checkbox" onchange="App.toggleChip(this, 'holland')">
                        <div class="w-9 h-9 rounded-lg border border-slate-200 flex items-center justify-center text-sm font-black text-slate-300 bg-white transition hover:bg-slate-50 peer-checked:bg-teal-500 peer-checked:text-white peer-checked:border-teal-500 shadow-sm">
                            ${c}
                        </div>
                    </label>`).join('');
            },

            bindEvents() {
                ['deptSelect', 'gradeSelect', 'classSelect'].forEach(id => {
                    document.getElementById(id).addEventListener('change', (e) => {
                        if(id === 'deptSelect') this.state.dept = e.target.value;
                        if(id === 'gradeSelect') this.state.grade = e.target.value;
                        if(id === 'classSelect') this.state.cls = e.target.value;
                        this.renderCourses();
                    });
                });
            },

            renderCourses() {
                const { dept, grade, cls } = this.state;
                const db = COURSE_DB[dept];
                const list = db?.years?.[grade]?.[cls] || [];
                
                document.getElementById('current-view-label').innerText = `${db.name} ${grade}年級 ${cls}班`;
                const container = document.getElementById('course-grid');

                if(list.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full py-12 flex flex-col items-center justify-center text-slate-400 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
                            <svg class="w-10 h-10 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <span class="text-sm font-medium">此班級暫無課程資料</span>
                            <span class="text-xs mt-1 text-slate-400">(如：人工智慧系 B 班或資工系 C/D 班)</span>
                        </div>`;
                    return;
                }

                container.innerHTML = list.map(c => {
                    const isSel = this.state.courses.has(c.n);
                    const tagClass = c.t === "必修" ? "bg-red-50 text-red-600 border-red-100" : "bg-blue-50 text-blue-600 border-blue-100";
                    return `
                    <div onclick="App.toggleCourse(this, '${c.n}')" 
                         class="course-card relative p-4 rounded-xl bg-white border border-slate-200 cursor-pointer ${isSel ? 'selected' : ''}">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${tagClass}">${c.t}</span>
                            <span class="text-[10px] font-mono font-bold text-slate-400 bg-slate-50 px-1.5 py-0.5 rounded">${c.c} 學分</span>
                        </div>
                        <h3 class="font-bold text-slate-800 text-base mb-1.5 leading-tight line-clamp-2">${c.n}</h3>
                        <div class="flex items-center gap-1.5 text-xs text-slate-500 font-medium">
                            <div class="w-5 h-5 rounded-full bg-slate-100 flex items-center justify-center text-[10px] text-slate-600">
                                ${c.p.charAt(0)}
                            </div>
                            ${c.p}
                        </div>
                        <div class="absolute top-3 right-3 w-5 h-5 rounded-full border-2 border-slate-200 flex items-center justify-center transition-all ${isSel ? 'bg-blue-500 border-blue-500 scale-110' : 'bg-transparent'}">
                            <svg class="w-3 h-3 text-white ${isSel ? 'opacity-100' : 'opacity-0'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                        </div>
                    </div>`;
                }).join('');
            },

            toggleCourse(el, name) {
                if(this.state.courses.has(name)) {
                    this.state.courses.delete(name);
                    el.classList.remove('selected');
                    el.querySelector('.bg-blue-500')?.classList.remove('bg-blue-500', 'border-blue-500', 'scale-110');
                    el.querySelector('svg.text-white')?.classList.replace('opacity-100', 'opacity-0');
                } else {
                    this.state.courses.add(name);
                    el.classList.add('selected');
                    el.querySelector('.border-slate-200')?.classList.add('bg-blue-500', 'border-blue-500', 'scale-110');
                    el.querySelector('svg.text-white')?.classList.replace('opacity-0', 'opacity-100');
                }
            },

            toggleChip(input, type) {
                const div = input.nextElementSibling;
                if(input.checked) {
                    if(type === 'exp') this.state.exp.add(input.value);
                    div.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
                    div.classList.remove('bg-white', 'text-slate-500');
                    if(type === 'holland') {
                        div.classList.remove('bg-white', 'text-slate-300'); 
                        div.classList.add('bg-teal-500', 'text-white', 'border-teal-500');
                    }
                } else {
                    if(type === 'exp') this.state.exp.delete(input.value);
                    div.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                    div.classList.add('bg-white', 'text-slate-500');
                    if(type === 'holland') {
                        div.classList.remove('bg-teal-500', 'text-white', 'border-teal-500');
                        div.classList.add('bg-white', 'text-slate-300');
                    }
                }
            },

            calculate() {
                const reqCount = this.state.courses.size;
                const expCount = this.state.exp.size;
                const certCount = document.querySelectorAll('#cert-chips input:checked').length;
                const hollandCount = document.querySelectorAll('#holland-chips input:checked').length;

                // 模擬運算邏輯
                const s = {
                    acad: Math.min(100, reqCount * 12),
                    exp: Math.min(100, expCount * 25),
                    skill: Math.min(100, certCount * 35),
                    match: Math.min(100, hollandCount * 25),
                    social: 70
                };
                const total = Math.round(s.acad*0.3 + s.exp*0.25 + s.skill*0.2 + s.match*0.15 + s.social*0.1);

                this.animateScore(total);
                this.renderChart(s);
                this.renderReport(total, s);
                document.getElementById('result-panel').classList.remove('hidden');
                document.getElementById('result-panel').scrollIntoView({ behavior: 'smooth' });
            },

            animateScore(score) {
                const circle = document.getElementById('score-arc');
                const offset = 251.2 - (score / 100) * 251.2;
                document.documentElement.style.setProperty('--target-dash', offset);
                circle.style.animation = 'dash 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards';
                
                let current = 0;
                const timer = setInterval(() => {
                    current += 1;
                    document.getElementById('score-val').innerText = current;
                    if(current >= score) { clearInterval(timer); document.getElementById('score-val').innerText = score; }
                }, 15);
            },

            renderChart(s) {
                const ctx = document.getElementById('radarChart').getContext('2d');
                if(this.state.chart) this.state.chart.destroy();
                this.state.chart = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: ['學業', '實務', '技能', '適性', '社交'],
                        datasets: [{
                            data: [s.acad, s.exp, s.skill, s.match, s.social],
                            backgroundColor: 'rgba(59, 130, 246, 0.2)',
                            borderColor: '#2563eb',
                            borderWidth: 2,
                            pointBackgroundColor: '#2563eb'
                        }]
                    },
                    options: {
                        scales: { r: { min: 0, max: 100, ticks: { display: false }, grid: { color: '#e2e8f0' } } },
                        plugins: { legend: { display: false } }
                    }
                });
            },

            renderReport(total, s) {
                const t = TRAITS[this.state.dept];
                const comm = total < 60 ? `修課學分略顯不足，建議優先鞏固${t.focus}核心必修。` :
                             (total < 85 ? `基礎不錯！建議加強${t.focus}相關的實習或專案經驗。` : `履歷極具競爭力！您的${t.focus}能力突出，可挑戰高階職位。`);
                
                document.getElementById('ai-comment').innerHTML = `<p class="font-bold text-slate-800 mb-1">診斷結果：</p>${comm}`;
                document.getElementById('career-tags').innerHTML = t.jobs.map(j => 
                    `<span class="inline-block bg-white border border-indigo-200 text-indigo-700 text-xs font-bold px-2 py-1 rounded-md shadow-sm">${j}</span>`
                ).join('');
            },

            saveProgress() {
                const d = { 
                    user: document.getElementById('inputName').value, 
                    dept: this.state.dept, 
                    grade: this.state.grade,
                    cls: this.state.cls,
                    courses: Array.from(this.state.courses)
                };
                localStorage.setItem('careerDNA_save_v6', JSON.stringify(d));
                alert('進度已儲存！');
            },

            loadUser() {
                const u = JSON.parse(localStorage.getItem('careerDNA_user') || '{}');
                if(u.name) document.getElementById('inputName').value = u.name;
            },
            
            reset() {
                if(confirm('確定要清除所有選項嗎？')) {
                    this.state.courses.clear();
                    this.state.exp.clear();
                    this.renderCourses();
                    this.renderChips();
                    document.getElementById('result-panel').classList.add('hidden');
                }
            },

            exportPDF() { alert('PDF 匯出模組準備中...'); }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
