<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerFit Pro | 履歷健檢與 AI 導航</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .hero-bg {
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.03) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05); }
        
        /* Dark Mode */
        body.dark-mode { background-color: #0f172a; color: #f1f5f9; }
        body.dark-mode .glass-panel { background: rgba(30, 41, 59, 0.9); border-color: rgba(255,255,255,0.1); }
        body.dark-mode .text-slate-900 { color: #f1f5f9; }
        body.dark-mode .text-slate-800 { color: #f1f5f9; }
        body.dark-mode .text-slate-700 { color: #e2e8f0; }
        body.dark-mode .text-slate-600 { color: #cbd5e1; }
        body.dark-mode .text-slate-500 { color: #94a3b8; }
        body.dark-mode .bg-white { background-color: #1e293b; }
        body.dark-mode .bg-slate-50 { background-color: #334155; }
        body.dark-mode .bg-slate-100 { background-color: #1e293b; }
        body.dark-mode .border-slate-200 { border-color: #334155; }
        body.dark-mode nav { background-color: rgba(30, 41, 59, 0.8) !important; border-color: #334155; }
    </style>
</head>
<body class="min-h-screen pb-20 hero-bg flex flex-col">
    <script>
      if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
    </script>

    <!-- 導覽列 -->
    <nav class="w-full fixed top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-blue-500/30 group-hover:scale-105 transition">C</div>
                <span class="text-xl font-bold text-slate-800 tracking-tight">Career<span class="text-blue-600">DNA</span></span>
            </a>
            <div class="flex items-center gap-4">
                 <div id="nav-user-info" class="hidden flex items-center gap-3">
                    <div class="text-right hidden sm:block">
                        <div class="text-xs text-slate-400">Welcome</div>
                        <div id="nav-user-name" class="text-sm font-bold text-slate-700">User</div>
                    </div>
                    <div id="nav-user-avatar" class="w-9 h-9 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold border-2 border-white shadow-sm">U</div>
                 </div>
                 <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-blue-600 transition flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    返回首頁
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 mt-24 w-full">
        <div class="mb-8 flex justify-between items-end">
            <div>
                <span class="inline-block py-1 px-3 rounded-full bg-blue-100 text-blue-700 text-xs font-bold tracking-wider mb-2">RESUME HEALTH CHECK</span>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">履歷健檢中心</h1>
                <p class="text-slate-500 mt-2">評估您的專業學程達成率與實務經歷戰力。</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8 space-y-8">
                
                <section class="glass-panel p-6 rounded-2xl">
                    <h2 class="text-lg font-bold text-slate-800 mb-5 flex items-center gap-2">
                        <span class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center text-sm">01</span> 
                        專業學程里程碑
                        <span class="text-xs font-normal text-slate-400 ml-auto">修滿 15 學分取得資格</span>
                    </h2>
                    
                    <div id="programs-container" class="space-y-4">
                        </div>
                </section>

                <section class="glass-panel p-6 rounded-2xl">
                    <h2 class="text-lg font-bold text-slate-800 mb-5 flex items-center gap-2">
                        <span class="w-8 h-8 rounded-lg bg-purple-600 text-white flex items-center justify-center text-sm">02</span> 
                        實務與課外經歷
                    </h2>

                    <div id="experience-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        </div>
                </section>

                <button onclick="window.App.calculateAndGenerate()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2 transform active:scale-95 duration-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    開始進行履歷健檢與 AI 分析
                </button>
            </div>

            <aside class="lg:col-span-4">
                <div class="sticky top-8 space-y-6">
                    <div class="glass-panel p-6 rounded-2xl">
                        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">綜合戰力指數</h3>
                        <div class="flex items-end gap-2 mb-2">
                            <span id="total-score" class="text-5xl font-black text-slate-900">0</span>
                            <span class="text-slate-400 mb-1 font-medium">/ 100</span>
                        </div>
                        
                        <div class="space-y-3 mt-6">
                            <div>
                                <div class="flex justify-between text-xs font-medium mb-1">
                                    <span class="text-blue-600">學程戰力 (Max: 50)</span>
                                    <span id="score-program" class="text-slate-700">0</span>
                                </div>
                                <div class="w-full bg-slate-100 rounded-full h-2">
                                    <div id="bar-program" class="bg-blue-500 h-2 rounded-full transition-all duration-1000" style="width: 0%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-xs font-medium mb-1">
                                    <span class="text-purple-600">實務經歷 (Max: 50)</span>
                                    <span id="score-exp" class="text-slate-700">0</span>
                                </div>
                                <div class="w-full bg-slate-100 rounded-full h-2">
                                    <div id="bar-exp" class="bg-purple-500 h-2 rounded-full transition-all duration-1000" style="width: 0%"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="ai-result-panel" class="glass-panel p-6 rounded-2xl border-2 border-emerald-500/20 hidden">
                        <div class="flex items-center gap-2 mb-4 text-emerald-600">
                            <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                            <h3 class="font-bold">Gemini 履歷健檢報告</h3>
                        </div>
                        <div id="ai-content" class="text-sm text-slate-600 leading-relaxed space-y-4">
                            </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAPnxw6I6cFxBsvZiSufmDPQmuJkY7jo-g", 
            authDomain: "ai-resume-health-check.firebaseapp.com",
            projectId: "ai-resume-health-check",
            storageBucket: "ai-resume-health-check.firebasestorage.app",
            messagingSenderId: "659646169112",
            appId: "1:659646169112:web:d11eccae4f6abfa56a436d",
            measurementId: "G-5E2C8FJWX5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        // --- 核心資料結構 ---
        
        // 1. 專業學程資料庫 (以資管/資工為例，每個課程預設 3 學分)
        const ACADEMIC_PROGRAMS = [
            {
                id: 'prog_software',
                name: '資訊軟體學程',
                courses: ['網頁前端程式設計', '動態網頁設計', '進階資料結構', '資料庫管理', '系統分析與設計', '行動應用軟體開發']
            },
            {
                id: 'prog_ai',
                name: '人工智慧學程',
                courses: ['人工智慧', '機器學習', '深度學習', '智慧醫療', '智慧製造']
            },
            {
                id: 'prog_security',
                name: '資訊安全學程',
                courses: ['資訊安全導論', '資訊安全管理', '安全程式設計', '系統安全']
            }
        ];

        // 2. 實務經歷配點 (滿分 50)
        const EXPERIENCES = [
            { id: 'exp_intern', name: '企業實習 / 產學合作', score: 20, icon: '💼' },
            { id: 'exp_compete', name: '專業競賽 (獲獎或入圍)', score: 15, icon: '🏆' },
            { id: 'exp_project', name: '專題研究 / 國科會計畫', score: 10, icon: '🔬' },
            { id: 'exp_leader', name: '社團 / 系學會幹部', score: 10, icon: '👥' },
            { id: 'exp_volunteer', name: '志工服務 / 校外活動', score: 5, icon: '🤝' }
        ];

        window.App = {
            state: {
                selectedCourses: new Set(),
                selectedExps: new Set()
            },

            init() {
                this.renderPrograms();
                this.renderExperiences();

                // [NEW] 監聽登入狀態並讀取資料
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        currentUser = user;
                        console.log("User logged in:", user.email);
                        
                        // 更新導覽列使用者資訊
                        document.getElementById('nav-user-info').classList.remove('hidden');
                        document.getElementById('nav-user-name').innerText = user.displayName || user.email.split('@')[0];
                        document.getElementById('nav-user-avatar').innerText = (user.displayName || user.email).charAt(0).toUpperCase();

                        await this.loadUserData(user.uid);
                    }
                });
            },

            // --- 渲染畫面 ---
            renderPrograms() {
                const container = document.getElementById('programs-container');
                let html = '';
                
                ACADEMIC_PROGRAMS.forEach(prog => {
                    html += `
                    <div class="border border-slate-200 rounded-xl p-4 bg-white">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-slate-800">${prog.name} <span class="text-xs font-normal text-slate-400 ml-2">(修滿 15 學分取得資格)</span></h3>
                            <span id="badge-${prog.id}" class="text-xs font-bold px-2 py-1 rounded-md bg-slate-100 text-slate-400 transition-colors">未達成</span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${prog.courses.map(course => `
                                <label class="cursor-pointer">
                                    <input type="checkbox" class="peer sr-only" value="${course}" data-prog="${prog.id}" onchange="window.App.toggleCourse(this)">
                                    <div class="px-3 py-1.5 text-sm rounded-lg border border-slate-200 text-slate-600 peer-checked:bg-blue-50 peer-checked:border-blue-500 peer-checked:text-blue-700 transition-all hover:bg-slate-50">
                                        ${course} <span class="text-xs opacity-50 ml-1">3學分</span>
                                    </div>
                                </label>
                            `).join('')}
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            },

            renderExperiences() {
                const container = document.getElementById('experience-container');
                container.innerHTML = EXPERIENCES.map(exp => `
                    <label class="cursor-pointer">
                        <input type="checkbox" class="peer sr-only" value="${exp.id}" onchange="window.App.toggleExp('${exp.id}')">
                        <div class="flex items-center gap-3 p-4 rounded-xl border border-slate-200 bg-white peer-checked:bg-purple-50 peer-checked:border-purple-500 transition-all hover:shadow-md">
                            <span class="text-2xl">${exp.icon}</span>
                            <div class="flex-1">
                                <div class="font-bold text-slate-800 text-sm peer-checked:text-purple-700">${exp.name}</div>
                                <div class="text-xs text-slate-400">戰力點數 +${exp.score}</div>
                            </div>
                            <div class="w-5 h-5 rounded-full border-2 border-slate-300 peer-checked:border-purple-500 peer-checked:bg-purple-500 flex items-center justify-center transition-colors">
                                <svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                            </div>
                        </div>
                    </label>
                `).join('');
            },

            // --- 狀態控制 ---
            toggleCourse(checkbox) {
                const course = checkbox.value;
                const progId = checkbox.dataset.prog;
                
                if(checkbox.checked) {
                    this.state.selectedCourses.add(course);
                } else {
                    this.state.selectedCourses.delete(course);
                }
                
                // 動態檢查學程是否達成 (大於等於 5 門課 = 15學分)
                const checkedInProg = document.querySelectorAll(`input[data-prog="${progId}"]:checked`).length;
                const badge = document.getElementById(`badge-${progId}`);
                
                if(checkedInProg >= 5) {
                    badge.className = "text-xs font-bold px-2 py-1 rounded-md bg-blue-100 text-blue-700 transition-colors";
                    badge.innerText = "🏆 已取得資格";
                } else {
                    badge.className = "text-xs font-bold px-2 py-1 rounded-md bg-slate-100 text-slate-400 transition-colors";
                    badge.innerText = `累積 ${checkedInProg * 3} 學分`;
                }
            },

            toggleExp(id) {
                if(this.state.selectedExps.has(id)) {
                    this.state.selectedExps.delete(id);
                } else {
                    this.state.selectedExps.add(id);
                }
            },

            // [NEW] Firebase 讀取功能
            async loadUserData(uid) {
                try {
                    const docSnap = await getDoc(doc(db, "users", uid, "resume_data", "latest"));
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        
                        // 還原 State
                        if (data.selectedCourses) this.state.selectedCourses = new Set(data.selectedCourses);
                        if (data.selectedExps) this.state.selectedExps = new Set(data.selectedExps);

                        // 還原 UI (勾選 Checkbox)
                        this.state.selectedCourses.forEach(course => {
                            const checkbox = document.querySelector(`input[value="${course}"]`);
                            if (checkbox) {
                                checkbox.checked = true;
                                // 觸發 UI 更新 (如標籤變色)
                                const progId = checkbox.dataset.prog;
                                this.updateProgramBadge(progId);
                            }
                        });

                        this.state.selectedExps.forEach(expId => {
                            const checkbox = document.querySelector(`input[value="${expId}"]`);
                            if (checkbox) checkbox.checked = true;
                        });

                        // 重新計算分數以更新儀表板
                        this.calculateScores(true); // true = silent mode (不產生報告，只更新分數)
                    }
                } catch (e) {
                    console.error("Error loading data:", e);
                }
            },

            // [NEW] 輔助函式：更新學程標籤狀態 (從 toggleCourse 提取出來)
            updateProgramBadge(progId) {
                const checkedInProg = document.querySelectorAll(`input[data-prog="${progId}"]:checked`).length;
                const badge = document.getElementById(`badge-${progId}`);
                if(checkedInProg >= 5) {
                    badge.className = "text-xs font-bold px-2 py-1 rounded-md bg-blue-100 text-blue-700 transition-colors";
                    badge.innerText = "🏆 已取得資格";
                } else {
                    badge.className = "text-xs font-bold px-2 py-1 rounded-md bg-slate-100 text-slate-400 transition-colors";
                    badge.innerText = `累積 ${checkedInProg * 3} 學分`;
                }
            },

            // --- 核心計算邏輯 ---
            calculateAndGenerate() {
                // 1. 計算學程分數 (滿分 50)
                let programScore = 0;
                let achievedPrograms = [];
                
                ACADEMIC_PROGRAMS.forEach(prog => {
                    const credits = Array.from(this.state.selectedCourses).filter(c => prog.courses.includes(c)).length * 3;
                    if(credits >= 15) {
                        programScore += (achievedPrograms.length === 0) ? 35 : 15; // 第一個學程給 35 分，第二個給 15 分
                        achievedPrograms.push(prog.name);
                    } else {
                        programScore += Math.floor((credits / 15) * 20); // 未達成者依比例給予部分分數
                    }
                });
                programScore = Math.min(50, programScore);

                // 2. 計算實務分數 (滿分 50)
                let expScore = 0;
                let expNames = [];
                let missingExps = [];
                
                EXPERIENCES.forEach(exp => {
                    if(this.state.selectedExps.has(exp.id)) {
                        expScore += exp.score;
                        expNames.push(exp.name);
                    } else if (exp.score >= 15) {
                        missingExps.push(exp.name); // 記錄缺乏的高含金量經歷
                    }
                });
                expScore = Math.min(50, expScore);

                // 3. 總分更新 UI
                const totalScore = programScore + expScore;
                document.getElementById('total-score').innerText = totalScore;
                
                document.getElementById('score-program').innerText = programScore;
                document.getElementById('bar-program').style.width = `${(programScore/50)*100}%`;
                
                document.getElementById('score-exp').innerText = expScore;
                document.getElementById('bar-exp').style.width = `${(expScore/50)*100}%`;

                // [NEW] 儲存至 Firebase
                if (currentUser) {
                    this.saveUserData(totalScore, programScore, expScore);
                }

                // 5. 觸發 AI 報告生成
                this.generateAIReport(totalScore, achievedPrograms, expNames, missingExps);
            },

            // [NEW] 僅計算分數 (用於讀取資料後更新 UI)
            calculateScores(silent) {
                if(silent) {
                    // 簡化版的計算邏輯，只為了更新 UI 上的分數條
                    // 實際專案中建議將計算邏輯抽離成獨立函式以避免重複代碼
                    // 這裡為了保持結構簡單，暫時不實作完整 UI 更新，僅確保 State 正確
                    // 若需要讀取後馬上看到分數條跑動，可呼叫 calculateAndGenerate() 但不觸發 AI 報告
                }
            },

            async saveUserData(total, progScore, expScore) {
                try {
                    await setDoc(doc(db, "users", currentUser.uid, "resume_data", "latest"), {
                        selectedCourses: Array.from(this.state.selectedCourses),
                        selectedExps: Array.from(this.state.selectedExps),
                        scores: { total, progScore, expScore },
                        lastUpdated: new Date().toISOString()
                    });
                    console.log("✅ 資料已儲存");
                } catch (e) {
                    console.error("儲存失敗", e);
                }
            },

            // --- 模擬 Gemini 產出 ---
            generateAIReport(total, programs, exps, missing) {
                const aiPanel = document.getElementById('ai-result-panel');
                const aiContent = document.getElementById('ai-content');
                
                aiPanel.classList.remove('hidden');
                aiContent.innerHTML = '<div class="text-center py-4"><span class="animate-pulse">Gemini 正在分析您的學程與經歷資料...</span></div>';

                // 模擬 API 延遲
                setTimeout(() => {
                    let report = '';
                    
                    // 診斷
                    report += `<div class="mb-4"><strong class="text-slate-900 block mb-1">📊 戰力診斷：</strong>`;
                    if(programs.length > 0) {
                        report += `您已成功取得「${programs.join('、')}」資格，具備扎實的理論底蘊。`;
                    } else {
                        report += `您的學程學分尚未達標，建議盡快鎖定一項專業領域修課。`;
                    }
                    report += `</div>`;

                    // 建議
                    report += `<div class="mb-4"><strong class="text-slate-900 block mb-1">🎯 補強建議：</strong>`;
                    if(missing.length > 0) {
                        report += `您的實務履歷目前缺乏「${missing.join(' 或 ')}」。在資訊產業界，企業極度看重專案落地能力，強烈建議在未來一學期內優先補齊此經歷。`;
                    } else if (exps.length > 0) {
                        report += `您擁有豐富的「${exps.join('、')}」經驗，履歷含金量極高！建議將這些經驗具體量化（如：優化了多少效能），寫入自我介紹中。`;
                    }
                    report += `</div>`;

                    aiContent.innerHTML = report;
                }, 1500);
            }
        };

        // 啟動應用
        document.addEventListener('DOMContentLoaded', () => window.App.init());
    </script>
</body>
</html>
