<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人檔案 | CareerDNA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05); }
        .input-field { transition: all 0.3s ease; }
        .input-field:focus { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1); }
        .hero-bg {
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.03) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        /* --- Global Dark Mode --- */
        body, body * { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        body.dark-mode { background-color: #0f172a; color: #f1f5f9; }
        /* Typography */
        body.dark-mode .text-slate-800,
        body.dark-mode .text-slate-700 { color: #f1f5f9; }
        body.dark-mode .text-slate-600 { color: #cbd5e1; }
        body.dark-mode .text-slate-500 { color: #94a3b8; }
        body.dark-mode .text-slate-400 { color: #64748b; }
        /* Backgrounds */
        body.dark-mode .bg-white { background-color: #1e293b; }
        body.dark-mode .bg-slate-50 { background-color: #334155; }
        body.dark-mode .bg-slate-100 { background-color: #1e293b; }
        body.dark-mode .bg-slate-200 { background-color: #475569; }
        /* Special Backgrounds */
        body.dark-mode .hero-bg { background-color: #0f172a; background-image: none; }
        body.dark-mode nav[class*="bg-white"] { background-color: rgba(30, 41, 59, 0.8) !important; border-color: #334155; }
        /* Components */
        body.dark-mode .glass-card { background: rgba(30, 41, 59, 0.9); border-color: rgba(255,255,255,0.1); }
        /* Forms */
        body.dark-mode .input-field { background-color: #334155; color: white; border-color: #475569; }
        body.dark-mode .input-field:focus { border-color: #3b82f6; background-color: #1e293b; }
        body.dark-mode input[disabled] { background-color: #1e293b; color: #64748b; }
        /* Borders */
        body.dark-mode .border-slate-100 { border-color: #334155; }
        /* Gradients & Special Colors */
        body.dark-mode .bg-gradient-to-br { background: linear-gradient(to bottom right, #1e3a8a, #3730a3); }
    </style>
</head>
<body class="min-h-screen hero-bg flex flex-col">
    <script>
      // Apply dark mode instantly to prevent FOUC (Flash of Unstyled Content)
      if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
      }
    </script>

    <!-- 導覽列 (與 Index 一致) -->
    <nav class="w-full fixed top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-blue-500/30 group-hover:scale-105 transition">C</div>
                <span class="text-xl font-bold text-slate-800 tracking-tight">Career<span class="text-blue-600">DNA</span></span>
            </a>
            <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-blue-600 transition flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                返回首頁
            </a>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-12 px-4 sm:px-6">
        <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-8">
            
            <!-- 左側：個人識別卡片 -->
            <div class="md:col-span-4 space-y-6 fade-in" style="animation-delay: 0.1s;">
                <div class="glass-card rounded-3xl p-8 text-center relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-br from-blue-500 to-indigo-600 opacity-10"></div>
                    
                    <div class="relative w-24 h-24 mx-auto mb-4">
                        <div class="w-full h-full rounded-full bg-white p-1 shadow-xl">
                            <div class="w-full h-full rounded-full bg-blue-100 flex items-center justify-center text-3xl font-black text-blue-600" id="avatar-text">
                                <!-- Initials -->
                            </div>
                        </div>
                        <div class="absolute bottom-0 right-0 w-6 h-6 bg-green-400 border-4 border-white rounded-full" title="Online"></div>
                    </div>

                    <h2 class="text-xl font-bold text-slate-800 mb-1" id="display-name">載入中...</h2>
                    <p class="text-sm text-slate-500 mb-6" id="display-email">...</p>

                </div>

                <!-- 溫馨提示卡 -->
                <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl p-6 text-white shadow-lg shadow-blue-500/30 fade-in" style="animation-delay: 0.2s;">
                    <h3 class="font-bold text-lg mb-2 flex items-center gap-2">
                        <span id="greeting-text">你好</span>
                    </h3>
                    <p class="text-blue-100 text-sm leading-relaxed opacity-90">
                        完善的個人資料能讓 AI 更精準地為您推薦職涯路徑。今天想探索些什麼呢？
                    </p>
                </div>
            </div>

            <!-- 右側：編輯表單 -->
            <div class="md:col-span-8 fade-in" style="animation-delay: 0.3s;">
                <div class="glass-card rounded-3xl p-8">
                    <div class="flex items-center justify-between mb-8">
                        <h2 class="text-xl font-bold text-slate-800">基本資料設定</h2>
                        <button id="save-btn" class="bg-slate-900 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-slate-800 transition shadow-lg flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                            <span>儲存變更</span>
                        </button>
                    </div>

                    <form id="profileForm" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-slate-600 ml-1">怎麼稱呼您？</label>
                                <input type="text" id="username" class="input-field w-full px-4 py-3 rounded-xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-blue-200 outline-none text-slate-800 font-medium placeholder-slate-400" placeholder="您的姓名或暱稱">
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-slate-600 ml-1">就讀學校</label>
                                <input type="text" id="school" class="input-field w-full px-4 py-3 rounded-xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-blue-200 outline-none text-slate-800 font-medium placeholder-slate-400" placeholder="例如：靜宜大學">
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-slate-600 ml-1">系所 / 專業</label>
                                <input type="text" id="department" class="input-field w-full px-4 py-3 rounded-xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-blue-200 outline-none text-slate-800 font-medium placeholder-slate-400" placeholder="例如：資訊管理學系">
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-slate-600 ml-1">目前年級</label>
                                <div class="relative">
                                    <select id="grade" class="input-field w-full px-4 py-3 rounded-xl bg-slate-50 border-2 border-transparent focus:bg-white focus:border-blue-200 outline-none text-slate-800 font-medium appearance-none cursor-pointer">
                                        <option value="">請選擇年級</option>
                                        <option value="大一">大一 (Freshman)</option>
                                        <option value="大二">大二 (Sophomore)</option>
                                        <option value="大三">大三 (Junior)</option>
                                        <option value="大四">大四 (Senior)</option>
                                        <option value="碩士">碩士 (Master)</option>
                                    </select>
                                    <div class="absolute right-4 top-1/2 transform -translate-y-1/2 pointer-events-none text-slate-400">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="pt-6 border-t border-slate-100">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h3 class="font-bold text-slate-700">深色模式 (Dark Mode)</h3>
                                    <p class="text-xs text-slate-400">將為您切換整個網站的介面主題。</p>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" id="dark-mode-toggle" class="sr-only peer"><div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div></label>
                            </div>
                        </div>

                        <div class="pt-6 border-t border-slate-100">
                            <div class="space-y-2 opacity-60">
                                <label class="text-sm font-bold text-slate-600 ml-1">登入帳號 (Email)</label>
                                <input type="email" id="email" disabled class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-transparent text-slate-500 font-medium cursor-not-allowed">
                                <p class="text-xs text-slate-400 ml-1">* 帳號信箱目前無法變更</p>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-6 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 z-50">
        <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        <span class="font-bold text-sm">資料更新成功！</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // [FIX] 內嵌 Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyAPnxw6I6cFxBsvZiSufmDPQmuJkY7jo-g", 
            authDomain: "ai-resume-health-check.firebaseapp.com",
            projectId: "ai-resume-health-check",
            storageBucket: "ai-resume-health-check.firebasestorage.app",
            messagingSenderId: "659646169112",
            appId: "1:659646169112:web:d11eccae4f6abfa56a436d",
            measurementId: "G-5E2C8FJWX5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 設定問候語
        const hour = new Date().getHours();
        const greeting = hour < 12 ? "早安" : (hour < 18 ? "午安" : "晚安");
        document.getElementById('greeting-text').innerText = `${greeting}，很高興見到你`;

        // Dark Mode Logic
        const darkModeToggle = document.getElementById('dark-mode-toggle');
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
            darkModeToggle.checked = true;
        }
        
        // [UPDATED] Dark Mode Toggle with Firebase Sync
        darkModeToggle.addEventListener('change', async (e) => {
            const isDark = e.target.checked;
            document.body.classList.toggle('dark-mode', isDark);
            localStorage.setItem('darkMode', isDark);
            
            // 如果已登入，同步設定到雲端
            if (currentUser) {
                try {
                    await setDoc(doc(db, "users", currentUser.uid), { 
                        settings: { darkMode: isDark } 
                    }, { merge: true });
                } catch(err) { console.error("Settings sync failed", err); }
            }
        });

        const form = document.getElementById('profileForm');
        const saveBtn = document.getElementById('save-btn');
        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('email').value = user.email;
                document.getElementById('display-email').innerText = user.email;
                document.getElementById('avatar-text').innerText = (user.displayName || user.email).charAt(0).toUpperCase();
                
                try {
                    const docSnap = await getDoc(doc(db, "users", user.uid));
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        document.getElementById('username').value = data.name || user.displayName || '';
                        document.getElementById('school').value = data.school || '';
                        document.getElementById('department').value = data.department || '';
                        document.getElementById('grade').value = data.grade || '';
                        
                        if(data.name) document.getElementById('display-name').innerText = data.name;
                        
                        // [NEW] 讀取雲端設定 (依照帳號為主)
                        if (data.settings && data.settings.darkMode !== undefined) {
                            const cloudDark = data.settings.darkMode;
                            // 更新本地狀態以符合雲端
                            localStorage.setItem('darkMode', cloudDark);
                            document.body.classList.toggle('dark-mode', cloudDark);
                            darkModeToggle.checked = cloudDark;
                        }
                    } else {
                        document.getElementById('display-name').innerText = user.displayName || "新朋友";
                    }
                } catch (e) {
                    console.error("Error loading profile:", e);
                }
            } else {
                window.location.href = 'index.html';
            }
        });

        saveBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            saveBtn.disabled = true;
            saveBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 儲存中...`;

            try {
                const updatedData = {
                    name: document.getElementById('username').value,
                    school: document.getElementById('school').value,
                    department: document.getElementById('department').value,
                    grade: document.getElementById('grade').value,
                    updatedAt: new Date()
                };
                
                await setDoc(doc(db, "users", currentUser.uid), updatedData, { merge: true });
                
                // [FIX] 同步更新 Firebase Auth Profile 與 LocalStorage，確保首頁名稱即時變更
                await updateProfile(currentUser, { displayName: updatedData.name });
                
                const savedUser = JSON.parse(localStorage.getItem('careerDNA_user') || '{}');
                if (savedUser.email) {
                    savedUser.name = updatedData.name;
                    localStorage.setItem('careerDNA_user', JSON.stringify(savedUser));
                }
                
                // Update UI immediately
                document.getElementById('display-name').innerText = updatedData.name;
                document.getElementById('avatar-text').innerText = updatedData.name.charAt(0).toUpperCase();

                // Show Toast
                const toast = document.getElementById('toast');
                toast.classList.remove('translate-y-20', 'opacity-0');
                setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
            } catch (error) {
                alert("更新失敗：" + error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = `<span>儲存變更</span>`;
            }
        });
    </script>
</body>
</html>
