<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CareerFit Pro | 履歷健檢與職涯導航 (v6.0 Integrated)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root{
            --primary:#2563eb; --primary-dark:#1e40af; --bg:#f8fafc; --surface:#fff;
            --muted:#64748b; --radius:14px; --shadow:0 8px 20px rgba(16,24,40,0.06);
            --success:#10b981; --warning:#f59e0b; --danger:#ef4444; --font:'Inter','Noto Sans TC',sans-serif;
        }
        *{box-sizing:border-box}
        html,body{height:100%;margin:0;font-family:var(--font);background:var(--bg);color:#0f172a}
        .container{max-width:1180px;margin:28px auto;padding:18px}
        header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:white;padding:20px;border-radius:12px;box-shadow:var(--shadow);}
        .header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px}
        h1{margin:0;font-size:1.25rem}

        .layout{display:grid;grid-template-columns:1fr;gap:20px;margin-top:20px}
        @media(min-width:1024px){.layout{grid-template-columns:1.3fr 0.7fr}}

        .card{background:var(--surface);border-radius:10px;padding:18px;box-shadow:var(--shadow);border:1px solid #e6eef8; transition: transform 0.2s;}
        .card:hover{border-color: #dbeafe;}
        
        label{display:block;margin-bottom:6px;font-weight:600;color:#0b1220}
        input[type=text],select{width:100%;padding:10px;border-radius:8px;border:1px solid #d1e3fb; outline:none; transition: border 0.2s;}
        input[type=text]:focus,select:focus{border-color: var(--primary);}

        .chip-group{display:flex;flex-wrap:wrap;gap:8px}
        .chip{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;border:1px solid #e6eef8;background:transparent;cursor:pointer;user-select:none; transition: all 0.2s;}
        .chip input{display:none}
        .chip:hover{background: #f1f5f9;}
        .chip.checked{background:rgba(37,99,235,0.08);border-color:rgba(37,99,235,0.18);color:var(--primary);font-weight:600}

        /* New: Required Badge Style */
        .badge-req { font-size: 0.75rem; background: #fee2e2; color: #b91c1c; padding: 2px 6px; border-radius: 4px; margin-right: 6px; font-weight: 700; }

        .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:10px;border:none;cursor:pointer;font-weight:700; transition: all 0.2s;}
        .btn:active{transform: scale(0.98);}
        .btn-primary{background:var(--primary);color:white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);}
        .btn-primary:hover{background:var(--primary-dark);}
        .btn-ghost{background:#fff;border:1px solid #e6eef8;color:var(--muted)}
        .btn-ghost:hover{background:#f8fafc; border-color: #cbd5e1;}

        .aside-sticky{position:sticky;top:22px}
        .gauge-wrap{display:flex;flex-direction:column;align-items:center;padding-top:6px}
        .gauge{width:220px;height:120px;position:relative}
        svg.gauge-svg{width:100%;height:100%;overflow:visible}
        .gauge-value{font-size:2.6rem;font-weight:800;line-height:1;color:#0b1220}
        .gauge-label{font-size:0.85rem;color:var(--muted)}

        .result-section{margin-top:14px}
        .result-list{list-style:none;padding:0;margin:0}
        .result-item{display:flex;gap:10px;padding:10px;border-radius:8px;margin-bottom:8px}
        .good{background:#ecfdf5;color:#065f46;border-left:4px solid var(--success)}
        .warn{background:#fffbeb;color:#92400e;border-left:4px solid var(--warning)}
        .bad{background:#fef2f2;color:#7f1d1d;border-left:4px solid var(--danger)}
        .info{background:#eff6ff;color:#1e40af;border-left:4px solid var(--primary)}

        .hidden{display:none}
        .fade-in{animation:fadeIn .45s ease-out both}
        @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

        .radar-box{height:220px;width:100%}
        .timeline{border-left:3px solid #e6eef8;padding-left:14px;margin-top:10px}
        .timeline .step{margin-bottom:12px; position: relative;}
        .timeline .step::before {content:''; position: absolute; left: -20px; top: 6px; width: 9px; height: 9px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 0 4px #eff6ff;}

        .nav-back { display: inline-flex; align-items: center; color: white; text-decoration: none; font-size: 0.9rem; opacity: 0.9; margin-bottom: 4px; }
        .nav-back:hover { opacity: 1; text-decoration: underline; }

        .toast-notification {
            position: fixed; bottom: 24px; right: 24px; 
            background: #0f172a; color: white; 
            padding: 12px 20px; border-radius: 8px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            font-size: 0.9rem; font-weight: 500;
            display: flex; align-items: center; gap: 10px;
            z-index: 1000; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="nav-back">← 返回首頁</a>
            <div class="header-inner">
                <div>
                    <h1>CareerFit Pro — 履歷健檢中心</h1>
                    <div style="font-size:.9rem;opacity:.9">已啟用跨模組資料同步 (v6.0)</div>
                </div>
                <div style="font-size:.9rem;background:rgba(255,255,255,0.15);padding:6px 12px;border-radius:999px; font-weight: 600;">Data Synced</div>
            </div>
        </header>

        <div class="layout">
            <main>
                <div class="card">
                    <h2 style="margin:0 0 10px;font-size:1rem">📝 基本資料與課程</h2>
                    <div style="display:grid;grid-template-columns:1fr 1fr 0.8fr 0.8fr;gap:12px;margin-bottom:12px">
                        <div><label for="inputName">姓名</label><input id="inputName" type="text" placeholder="你的名字"></div>
                        <div><label for="deptSelect">系所</label>
                            <select id="deptSelect"></select>
                        </div>
                        <div><label for="gradeSelect">年級</label>
                            <select id="gradeSelect"></select>
                        </div>
                        <div><label for="classSelect">班級</label>
                            <select id="classSelect">
                                <option value="A">A 班</option>
                                <option value="B">B 班</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label>課程完成 (紅色標籤為必修)</label>
                        <div id="courseContainer" class="fade-in"></div>
                    </div>
                </div>

                <div class="card" style="margin-top:18px">
                    <h2 style="margin:0 0 10px;font-size:1rem">🚀 經歷與特質加權</h2>
                    <div style="margin-bottom:12px">
                        <label>實作與經歷</label>
                        <div id="experienceArea" class="chip-group"></div>
                    </div>
                    <div style="margin-bottom:12px">
                        <label>專業證照</label>
                        <div id="certArea" class="chip-group"></div>
                    </div>
                    <div style="margin-bottom:12px">
                        <label>Holland 興趣代碼 (品牌經營區)</label>
                        <p style="font-size:0.8rem; color:var(--muted); margin-bottom: 6px;">*系統將自動同步個人品牌測驗結果</p>
                        <div id="hollandArea" class="chip-group"></div>
                    </div>
                    <div style="display:flex;gap:10px;margin-top:20px;padding-top:15px;border-top:1px solid #f1f5f9;">
                        <button class="btn btn-primary" id="calcBtn">📊 計算履歷健康指數</button>
                        <button class="btn btn-ghost" id="resetBtn">重置</button>
                        <button class="btn btn-ghost" id="saveBtn">💾 儲存檔案</button>
                    </div>
                </div>
            </main>

            <aside>
                <div class="card aside-sticky">
                    <div style="text-align:center;margin-bottom:8px">
                        <div class="gauge-wrap">
                            <div class="gauge">
                                <svg class="gauge-svg" viewBox="0 0 200 120">
                                    <defs>
                                        <linearGradient id="g1" x1="0%" x2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
                                    </defs>
                                    <path d="M20 100 A 80 80 0 0 1 180 100" stroke="#e6eef8" stroke-width="12" fill="none" stroke-linecap="round"></path>
                                    <path id="gaugeArc" d="M20 100 A 80 80 0 0 1 180 100" stroke="url(#g1)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="0 251.2"></path>
                                </svg>
                            </div>
                            <div style="text-align:center;margin-top:6px">
                                <div class="gauge-value" id="scoreValue">0</div>
                                <div class="gauge-label">總分 (100分制)</div>
                            </div>
                        </div>
                    </div>

                    <div id="emptyState" style="text-align:center;color:var(--muted);padding:14px;font-size:0.9rem;">
                        <p>請填寫資料並點擊「計算」<br>系統將根據五大維度進行評分</p>
                    </div>

                    <div id="resultContent" class="hidden">
                        <div class="result-section fade-in">
                            <h3 style="margin:0 0 8px">📊 五力健檢雷達圖</h3>
                            <div class="radar-box"><canvas id="radarChart"></canvas></div>
                        </div>

                        <div class="result-section fade-in" style="margin-top:8px">
                            <h3 style="margin:0 0 8px">🎯 職涯適配 (Holland Top-3)</h3>
                            <div id="deptMatchCard" style="padding:10px;border-radius:8px;background:#f0f9ff;border:1px solid #bae6fd;margin-bottom:8px;font-size:0.9rem;"></div>
                            <ul id="careerList" class="result-list"></ul>
                        </div>

                        <div class="result-section fade-in" style="margin-top:8px">
                            <h3 style="margin:0 0 8px">💡 職涯適配分析建議</h3>
                            <div id="careerAdvice" class="result-item info" style="font-size:0.9rem; line-height:1.5;"></div>
                        </div>

                        <div class="result-section fade-in" style="margin-top:8px">
                            <h3 style="margin:0 0 8px">✅ 優勢 / ❌ 待補足</h3>
                            <ul id="strengthList" class="result-list"></ul>
                            <ul id="weakList" class="result-list"></ul>
                        </div>

                        <div class="result-section fade-in" style="margin-top:8px">
                            <h3 style="margin:0 0 8px">📅 30/60/90 天行動計畫</h3>
                            <div class="timeline" id="actionPlanArea"></div>
                        </div>

                        <div style="margin-top:12px"><button class="btn btn-primary" style="width:100%" id="downloadBtn">📄 下載完整報告 (PDF)</button></div>
                    </div>

                </div>
            </aside>
        </div>
    </div>

<script>
/* ---------- Data (Integrated from File 2) ---------- */
// Helper to create course objects quickly
const c = (n, t='opt') => ({ name: n, type: t });

const DB = {
    "資管": {
        "A": {
            "三上": [
                c("作業系統", "req"), c("作業研究", "req"), c("專案實作(一)", "req"),
                c("影像處理"), c("機器學習"), c("財務會計資訊系統"), c("物聯網無線通訊技術與應用"),
                c("Python應用實務"), c("企業流程管理"), c("進階資訊日文"), c("人工智慧與永續發展專題")
            ],
            "default": ["計算機概論", "會計學", "資料結構"] // Fallback for other grades
        },
        "B": {
            "三上": [
                c("作業系統", "req"), c("作業研究", "req"), c("專案實作(一)", "req"),
                c("影像處理"), c("機器學習"), c("財務會計資訊系統"), c("物聯網無線通訊技術與應用"),
                c("Python應用實務"), c("企業流程管理"), c("進階資訊日文"), c("人工智慧與永續發展專題")
            ],
            "default": ["計算機概論", "會計學", "資料結構"]
        }
    },
    "資工": {
        "A": {
            "三上": [ // Using B's data pattern for consistency
                c("作業系統(合授)", "req"), c("專案實作(一)", "req"),
                c("人工智慧"), c("網路安全"), c("動態網頁設計"), c("硬體描述語言"), c("行動應用軟體開發"),
                c("嵌入式微控制器"), c("Linux系統與網路管理"), c("電腦視覺概論"),
                c("系統安全"), c("數位訊號處理"), c("IC設計產業實務應用"), c("進階資訊日文")
            ],
            "default": ["微積分", "程式設計", "演算法"]
        },
        "B": {
            "三上": [
                c("作業系統(合授)", "req"), c("專案實作(一)", "req"),
                c("人工智慧"), c("網路安全"), c("動態網頁設計"), c("硬體描述語言"), c("行動應用軟體開發"),
                c("嵌入式微控制器"), c("Linux系統與網路管理"), c("電腦視覺概論"),
                c("系統安全"), c("數位訊號處理"), c("IC設計產業實務應用"), c("進階資訊日文")
            ],
            "default": ["微積分", "程式設計", "演算法"]
        }
    },
    "人工智慧": { // Originally 資傳 in File 1, updated to AI as per File 2
        "A": {
            "三上": [
                c("作業系統(合授)", "req"), c("專案實作(一)", "req"), c("演算法概論", "req"),
                c("組合數學"), c("資料庫管理"), c("網路系統建構實務"), c("深度學習"), c("軟體開發與維運"),
                c("科技互動藝術"), c("虛擬實境體感開發"), c("進階資訊日文"), c("生成式人工智慧"), c("數位美學應用")
            ],
            "default": ["新媒體概論", "互動設計", "數位行銷"]
        },
        "B": {
            "三上": [
                c("作業系統(合授)", "req"), c("專案實作(一)", "req"), c("演算法概論", "req"),
                c("組合數學"), c("資料庫管理"), c("網路系統建構實務"), c("深度學習"), c("軟體開發與維運"),
                c("科技互動藝術"), c("虛擬實境體感開發"), c("進階資訊日文"), c("生成式人工智慧"), c("數位美學應用")
            ],
            "default": ["新媒體概論", "互動設計", "數位行銷"]
        }
    }
};

const TRAITS = {
    "資管": { holland: ["C", "E", "I"], focus: "商業邏輯 x 資訊技術" },
    "資工": { holland: ["I", "R", "C"], focus: "演算法 x 系統底層" },
    "人工智慧": { holland: ["A", "I", "R"], focus: "AI 模型 x 互動應用" }
};

const DATA = {
    experienceList:[{v:'競賽',t:'🏆 競賽/獎項'},{v:'社團幹部',t:'👥 社團/學生會'},{v:'專案實作',t:'💻 專題/Side Project'},{v:'企業實習',t:'💼 企業實習'}],
    certList:[{v:'A級',t:'🥇 A 級 (國際/高階)'},{v:'B級',t:'🥈 B 級 (國內/基礎)'},{v:'無',t:'無'}],
    hollandCodes:['R','I','A','S','E','C']
};

/* ---------- App Logic ---------- */
const App = {
    state:{ dept:'資管', grade:'三上', classId:'B', chart:null }, // Default state based on prompt

    init(){
        this.bindSelectors();
        this.renderCourses();
        this.renderChipGroups();
        this.checkUser();
        this.restore();
        this.bindActions();
        this.checkSyncData();
    },

    checkUser(){
        const user = localStorage.getItem('careerDNA_user');
        if(user){
            try { const u = JSON.parse(user); if(u.name) document.getElementById('inputName').value = u.name; } catch(e){}
        }
    },

    checkSyncData(){
        const syncRaw = localStorage.getItem('careerDNA_sync');
        if(syncRaw){
            try {
                const sync = JSON.parse(syncRaw);
                const hCodes = Array.isArray(sync.holland) ? sync.holland : [];
                hCodes.forEach(code => {
                    const input = document.querySelector(`#hollandArea input[value="${code}"]`);
                    if(input && !input.checked){ input.checked = true; input.closest('.chip').classList.add('checked'); }
                });
            } catch(e){ console.error('Sync error', e); }
        }
    },

    showToast(msg){
        const t = document.createElement('div'); t.className = 'toast-notification';
        t.innerHTML = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span>${msg}</span>`;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    },

    bindSelectors(){
        // Dept
        const deptSelect=document.getElementById('deptSelect');
        Object.keys(DB).forEach(k=>{
            const opt=document.createElement('option'); opt.value=k; opt.textContent=k; deptSelect.appendChild(opt);
        });
        deptSelect.value=this.state.dept;

        // Grade
        const grade=document.getElementById('gradeSelect');
        ['一上','一下','二上','二下','三上','三下','四上','四下','延畢'].forEach(g=>{
            const o=document.createElement('option'); o.value=g; o.textContent=g; grade.appendChild(o)
        });
        grade.value=this.state.grade;

        // Class
        const classSel = document.getElementById('classSelect');
        classSel.value = this.state.classId;

        const refresh = () => {
            this.state.dept = deptSelect.value;
            this.state.grade = grade.value;
            this.state.classId = classSel.value;
            this.renderCourses();
        };

        deptSelect.addEventListener('change', refresh);
        grade.addEventListener('change', refresh);
        classSel.addEventListener('change', refresh);
    },

    renderCourses(){
        const container = document.getElementById('courseContainer'); container.innerHTML = '';
        
        // Data Access Logic for Deep Structure
        let courses = [];
        try {
            // Check if specific grade data exists, else fallback
            const classData = DB[this.state.dept][this.state.classId];
            courses = classData[this.state.grade] || classData['default'] || [];
        } catch(e) {
            courses = [];
        }

        const wrap = document.createElement('div'); wrap.style.marginBottom='8px';
        const title = document.createElement('h4'); 
        title.innerHTML = `${this.state.grade} 課程清單 <span style="font-weight:400; font-size:0.8rem; color:var(--muted)">(${this.state.classId}班)</span>`;
        title.style.margin='6px 0 6px'; title.style.fontSize='0.9rem'; title.style.fontWeight='700';
        wrap.appendChild(title);

        const group = document.createElement('div'); group.className='chip-group';
        
        courses.forEach(c => {
            // Handle both object format {name, type} and simple string format
            const cName = typeof c === 'string' ? c : c.name;
            const cType = typeof c === 'string' ? 'opt' : c.type;

            const label=document.createElement('label'); label.className='chip'; label.setAttribute('tabindex','0');
            const input=document.createElement('input'); input.type='checkbox'; input.value=cName; input.dataset.type = (cType === 'req') ? 'required' : 'optional';
            
            let htmlContent = '';
            if(cType === 'req') htmlContent += '<span class="badge-req">必</span>';
            htmlContent += `<span>${cName}</span>`;
            
            label.innerHTML = htmlContent;
            label.prepend(input); // Put input first for logic

            label.addEventListener('click', (e) => {
                if(e.target !== input) {
                    input.checked = !input.checked; 
                    label.classList.toggle('checked', input.checked);
                }
            });
            input.addEventListener('change', () => label.classList.toggle('checked', input.checked));
            group.appendChild(label);
        });

        if(courses.length === 0){ 
            group.innerHTML = '<div style="color:var(--muted); font-size:0.9rem; padding:4px;">(此學期暫無資料，請切換至「三上」查看範例)</div>';
        }
        
        wrap.appendChild(group);
        container.appendChild(wrap);
        this.restoreChecks();
    },

    renderChipGroups(){
        const createGroup = (id, list) => {
            const area = document.getElementById(id); area.innerHTML='';
            list.forEach(it => {
                const label=document.createElement('label');label.className='chip';label.tabIndex=0;
                const input=document.createElement('input');input.type='checkbox';input.value=it.v || it;
                const span=document.createElement('span'); span.textContent = it.t || it;
                
                // Special mapping for Holland tooltip if needed
                if(id === 'hollandArea') {
                    const tooltipMap = {R:'實作',I:'研究',A:'藝術',S:'社交',E:'企業',C:'常規'};
                    span.textContent = `${it} ${tooltipMap[it]}`;
                }

                label.appendChild(input); label.appendChild(span);
                label.addEventListener('click', () => {input.checked=!input.checked; label.classList.toggle('checked', input.checked)});
                area.appendChild(label);
            });
        };

        createGroup('experienceArea', DATA.experienceList);
        createGroup('certArea', DATA.certList);
        createGroup('hollandArea', DATA.hollandCodes);
    },

    bindActions(){
        document.getElementById('calcBtn').addEventListener('click',()=>this.calculate());
        document.getElementById('resetBtn').addEventListener('click',()=>this.reset());
        document.getElementById('downloadBtn').addEventListener('click',()=>this.generatePDF());
        document.getElementById('saveBtn').addEventListener('click',()=>this.saveToFile());
    },

    calculate(){
        const reqs = document.querySelectorAll('input[data-type="required"]');
        const reqTotal = reqs.length;
        const reqChecked = document.querySelectorAll('input[data-type="required"]:checked').length;
        const optChecked = document.querySelectorAll('input[data-type="optional"]:checked').length;
        
        const exp = Array.from(document.querySelectorAll('#experienceArea input:checked')).map(i=>i.value);
        const certs = Array.from(document.querySelectorAll('#certArea input:checked')).map(i=>i.value);
        const holland = Array.from(document.querySelectorAll('#hollandArea input:checked')).map(i=>i.value);

        const dims = {};
        // Academic: Logic adjusted for mixed req/opt
        const baseAcademic = reqTotal > 0 ? (reqChecked/reqTotal)*100 : 0;
        dims.academic = Math.min(100, Math.round(baseAcademic + (optChecked * 5))); 
        
        dims.practical = Math.min(exp.length * 30, 100);
        dims.skill = certs.includes('A級') ? 100 : (certs.includes('B級')?70:30);
        
        const traits = TRAITS[this.state.dept].holland;
        const matchCount = holland.filter(h=>traits.includes(h)).length;
        dims.match = matchCount>=2 ? 95 : (matchCount===1?70:45);
        dims.communication = (exp.includes('社團幹部')||exp.includes('競賽'))?95:65;

        let total = Math.round((dims.academic*0.25 + dims.practical*0.2 + dims.skill*0.2 + dims.match*0.2 + dims.communication*0.15));
        total = Math.max(0,Math.min(100,total));

        this.updateGauge(total);
        this.renderRadar(dims);
        this.renderReport({reqTotal, reqChecked, exp, certs, holland}, dims, total);
        
        document.getElementById('emptyState').classList.add('hidden');
        document.getElementById('resultContent').classList.remove('hidden');
        this.saveState();
        this.showToast('分析完成！');
    },

    updateGauge(score){
        const arc=document.getElementById('gaugeArc');
        const circumference=251.2; 
        const dash = (score/100)*circumference;
        arc.style.transition='stroke-dasharray 900ms cubic-bezier(.2,.9,.2,1)';
        arc.setAttribute('stroke-dasharray',`${dash} ${circumference}`);
        document.getElementById('scoreValue').textContent=score;
    },

    renderRadar(dims){
        const ctx=document.getElementById('radarChart').getContext('2d');
        if(this.state.chart) this.state.chart.destroy();
        this.state.chart = new Chart(ctx,{
            type:'radar',
            data:{labels:['學業完成','實務經歷','專業技能','科系適性','溝通協作'],datasets:[{label:'能力分佈',data:[dims.academic,dims.practical,dims.skill,dims.match,dims.communication],fill:true,backgroundColor:'rgba(37,99,235,0.16)',borderColor:'#2563eb',pointBackgroundColor:'#2563eb',borderWidth:2}]},
            options:{
                responsive:true,maintainAspectRatio:false,
                scales:{r:{beginAtZero:true,min:0,max:100,ticks:{display:false}}},
                plugins:{legend:{display:false}}
            }
        });
    },

    renderReport(inputs, dims, total){
        const add=(el,txt,cls)=>{const li=document.createElement('li');li.className=`result-item ${cls}`;li.textContent=txt;document.getElementById(el).appendChild(li)};
        document.getElementById('strengthList').innerHTML='';document.getElementById('weakList').innerHTML='';document.getElementById('careerList').innerHTML='';

        // Strength/Weakness Logic
        if(dims.academic>=80) add('strengthList','學業基礎穩固，必修課程完成度高。','good'); else add('weakList','必修學分有缺口，請優先確認修課計畫。','bad');
        if(dims.practical>=50) add('strengthList','具備實務經驗，履歷競爭力佳。','good'); else add('weakList','缺乏專題或實習經歷，建議參加黑客松或 Side Project。','warn');
        if(dims.skill>=70) add('strengthList','證照或技能基礎良好。','good'); else add('weakList','建議取得相關證照或完成技能課程。','warn');

        // Dept Match & Careers
        const traits = TRAITS[this.state.dept];
        document.getElementById('deptMatchCard').innerHTML = `
            <strong>${this.state.dept} 重點：</strong> ${traits.focus}<br>
            <strong>適性代碼：</strong> ${traits.holland.join('')} 
            (你的吻合度: ${dims.match>=80 ? '<span style="color:green">高</span>' : '一般'})
        `;

        const careerMap = { 
            '資管':['PM 專案經理','ERP 系統分析師','資料科學家'], 
            '資工':['全端工程師','韌體工程師','系統架構師'], 
            '人工智慧':['AI 應用工程師','電腦視覺研發','互動科技設計師'] 
        };
        careerMap[this.state.dept].forEach(c=>{const li=document.createElement('li');li.className='result-item good';li.textContent=c;document.getElementById('careerList').appendChild(li)});

        // NEW: Career Advice Analysis Logic
        const adviceDiv = document.getElementById('careerAdvice');
        let adviceText = "";
        
        if (dims.match >= 85) {
            adviceText = `太棒了！你的特質與${this.state.dept}高度契合。這代表你在該領域的學習與工作中會感到如魚得水。建議你挑戰更進階的「${careerMap[this.state.dept][0]}」職位，並嘗試擔任 Team Leader 角色，發揮你的優勢。`;
        } else if (dims.match >= 60) {
            adviceText = `你的特質與科系有部分重疊，這是很好的平衡點。你可能在某些特定領域（如${traits.focus.split('x')[1]}）表現較好，但在另一部分感到吃力。建議尋找跨領域的結合點，例如將技術應用於你有興趣的產業。`;
        } else {
            adviceText = `目前的適性分析顯示你可能正在「舒適圈外」努力。這不代表你不適合，而是你可能需要調整學習方法，或是你擁有非常獨特的跨領域視角（例如將${this.state.dept}背景應用於藝術或行銷）。建議多探索跨系選修，找出你的獨特利基。`;
        }
        adviceDiv.textContent = adviceText;

        // Action Plan
        const grade = this.state.grade;
        let actionHTML = '';
        if(grade.includes('三')){
            actionHTML = `<div class="step"><strong>30 天：</strong>完成專題原型 (Prototype)，並整理至 GitHub/作品集網站。</div><div class="step"><strong>60 天：</strong>鎖定 3-5 間理想實習公司，針對性調整履歷。</div><div class="step"><strong>90 天：</strong>進行模擬面試，並考取一張進階證照 (如 AWS/GCP)。</div>`;
        } else if(grade.includes('四')){
            actionHTML = `<div class="step"><strong>30 天：</strong>全力衝刺畢業專題，確保可以 Demo 展示。</div><div class="step"><strong>60 天：</strong>投遞正職履歷，利用就業博覽會建立人脈。</div>`;
        } else {
            actionHTML = `<div class="step"><strong>30 天：</strong>探索系上選修，加入一個感興趣的社團或讀書會。</div><div class="step"><strong>60 天：</strong>維持 GPA，並嘗試接觸基礎程式或設計工具。</div>`;
        }
        document.getElementById('actionPlanArea').innerHTML = actionHTML;
    },

    saveState(){
        try{
            const s={dept:this.state.dept, grade:this.state.grade, classId:this.state.classId, name:document.getElementById('inputName').value, checks:Array.from(document.querySelectorAll('input:checked')).map(i=>i.value)};
            localStorage.setItem('careerfit_v6',JSON.stringify(s));
        }catch(e){}
    },

    restore(){
        try{
            const s=JSON.parse(localStorage.getItem('careerfit_v6'));
            if(s){
                if(s.dept){this.state.dept=s.dept;document.getElementById('deptSelect').value=s.dept}
                if(s.grade){this.state.grade=s.grade;document.getElementById('gradeSelect').value=s.grade}
                if(s.classId){this.state.classId=s.classId;document.getElementById('classSelect').value=s.classId}
                if(s.name)document.getElementById('inputName').value=s.name
            }
        }catch(e){}
    },

    restoreChecks(){
        try{
            const s=JSON.parse(localStorage.getItem('careerfit_v6'));
            if(s && s.checks) {
                s.checks.forEach(v=>{
                    // Escape special chars like parentheses for querySelector
                    const safeVal = v.replace(/([ #;?%&,.+*~\':"!^$[\]()=>|\/@])/g,'\\$1'); 
                    const el=document.querySelector(`input[value="${safeVal}"]`); 
                    if(el){el.checked=true; el.closest('label')?.classList?.add('checked')}
                });
            }
        }catch(e){}
    },

    reset(){ if(confirm('重置將清除資料？')){localStorage.removeItem('careerfit_v6');location.reload();} },
    generatePDF(){
        html2canvas(document.querySelector('.container'),{scale:2}).then(canvas=>{
            const pdf = new jspdf.jsPDF('p','mm','a4');
            pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,210,(canvas.height*210)/canvas.width);
            pdf.save('CareerFit_Report.pdf');
        });
    },
    saveToFile(){
        const data = {name:document.getElementById('inputName').value, ...this.state};
        const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='career_data.json'; a.click();
    }
};

document.addEventListener('DOMContentLoaded',()=>App.init());
</script>
</body>
</html>
