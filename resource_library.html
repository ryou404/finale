<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth bg-white text-klein">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerDNA | 課程資料庫 (Course Database)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@300;400;500;700;900&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="static/courses_data.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        klein: '#002FA7',
                        'deep-klein': '#001a5e',
                        cobalt: '#1F50CD',
                        sapphire: '#3B6BF0',
                        ice: '#EBF2FF',
                        iceBorder: '#C7DCFF',
                        canvas: '#F8FAFF',
                        'electric-blue': '#00e5ff',
                        'flame-orange': '#ff4500'
                    },
                    fontFamily: {
                        syne: ['"Syne"', 'sans-serif'],
                        heading: ['"Syne"', '"Noto Sans TC"', 'sans-serif'],
                        body: ['Inter', '"Noto Sans TC"', 'sans-serif'],
                        mono: ['"Chakra Petch"', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            background-color: #F8FAFF;
            color: #002FA7;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
        }
        .hover-spring { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .hover-spring:hover { transform: translateY(-3px); }
        .course-card {
            background-color: #FFFFFF;
            border: 1px solid #C7DCFF;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .course-card:hover {
            box-shadow: 0 14px 28px -12px rgba(15, 23, 42, 0.12);
            border-color: #1F50CD;
            transform: translateY(-4px);
        }
        
        /* Markdown Styles */
        .prose-klein h3 { font-size: 1.25rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; border-bottom: 1px solid #C7DCFF; padding-bottom: 0.5rem; }
        .prose-klein p { margin-bottom: 1rem; line-height: 1.7; color: #1E3A8A; }
        .prose-klein ul, .prose-klein ol { margin-bottom: 1rem; padding-left: 1.5rem; }
        .prose-klein ul { list-style-type: disc; }
        .prose-klein ol { list-style-type: decimal; }
        .prose-klein li { margin-bottom: 0.25rem; }
        .prose-klein strong { font-weight: 700; color: #002FA7; }
        .prose-klein table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
        .prose-klein th, .prose-klein td { border: 1px solid #C7DCFF; padding: 0.5rem; text-align: left; }
        .prose-klein th { background-color: #EBF2FF; font-weight: 700; }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <!-- Navbar -->
    <header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-klein/10">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 md:px-8 h-16 sm:h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 sm:gap-4 group shrink-0">
                <div class="w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center border border-klein/20 text-klein font-mono text-base sm:text-xl group-hover:bg-klein group-hover:text-white transition-all">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-syne font-extrabold text-lg sm:text-2xl tracking-tighter uppercase text-klein">CareerDNA</span>
                    <span class="font-mono text-[8px] sm:text-[9px] uppercase tracking-[0.2em] sm:tracking-[0.3em] text-klein/40 -mt-0.5 sm:-mt-1 hidden sm:block">COURSE_LIBRARY // v2026</span>
                </div>
            </a>
            <div class="hidden md:flex items-center gap-6 lg:gap-10 shrink-0 mx-auto">
                <a href="brand_test.html" class="font-mono uppercase text-xs font-bold tracking-[0.2em] text-klein/60 hover:text-klein transition-colors">品牌測驗</a>
                <a href="career_fit.html" class="font-mono uppercase text-xs font-bold tracking-[0.2em] text-klein/60 hover:text-klein transition-colors">AI 履歷健檢</a>
                <a href="lab_recommendation.html" class="font-mono uppercase text-xs font-bold tracking-[0.2em] text-klein/60 hover:text-klein transition-colors">系所推薦</a>
                <a href="resource_library.html" class="font-mono uppercase text-xs font-bold tracking-[0.2em] text-klein transition-colors border-b-2 border-klein pb-1">課程資料庫</a>
                <a href="profile.html" class="font-mono uppercase text-xs font-bold tracking-[0.2em] text-klein/60 hover:text-klein transition-colors">個人檔案</a>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <a href="career_fit.html" class="hidden sm:flex hover-spring bg-klein text-white font-mono text-[10px] sm:text-xs font-bold tracking-[0.2em] uppercase px-3 py-1.5 sm:px-4 sm:py-2 items-center gap-2">
                    <span>立即診斷</span> <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </a>
            </div>
        </div>
    </header>

    <nav class="md:hidden fixed bottom-0 left-0 right-0 w-full z-50 bg-white/95 backdrop-blur-xl border-t border-klein/10 px-2 py-2 flex justify-between items-center overflow-x-auto whitespace-nowrap shadow-[0_-4px_20px_rgba(0,0,0,0.08)] pb-[calc(8px+env(safe-area-inset-bottom))]">
        <a href="brand_test.html" class="font-mono uppercase text-[11px] font-bold tracking-tight text-klein/70 hover:text-klein px-2 py-1 transition-colors shrink-0">品牌測驗</a>
        <a href="career_fit.html" class="font-mono uppercase text-[11px] font-bold tracking-tight text-klein/70 hover:text-klein px-2 py-1 transition-colors shrink-0">AI 履歷健檢</a>
        <a href="lab_recommendation.html" class="font-mono uppercase text-[11px] font-bold tracking-tight text-klein/70 hover:text-klein px-2 py-1 transition-colors shrink-0">系所推薦</a>
        <a href="resource_library.html" class="font-mono uppercase text-[11px] font-bold tracking-tight text-klein px-2 py-1 transition-colors shrink-0 border-b border-klein">課程資料庫</a>
        <a href="profile.html" class="font-mono uppercase text-[11px] font-bold tracking-tight text-klein/70 hover:text-klein px-2 py-1 transition-colors shrink-0">個人檔案</a>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-24 sm:pt-32 pb-24 px-4 sm:px-8 max-w-[1400px] mx-auto w-full flex flex-col lg:flex-row gap-8">
        
        <!-- Sidebar Filters -->
        <aside class="w-full lg:w-64 shrink-0 flex flex-col gap-6">
            <div>
                <h1 class="font-syne font-extrabold text-3xl sm:text-4xl text-klein mb-2 tracking-tight">COURSES</h1>
                <p class="font-body text-klein/60 text-sm">瀏覽與搜尋全系所課程，包含資工、資管與人工智慧學系的所有必選修資料。</p>
            </div>

            <!-- Search Box -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-klein/40"></i>
                <input type="text" id="search-input" placeholder="搜尋課程名稱或老師..." 
                    class="w-full border border-klein/20 bg-gray-50 pl-10 pr-4 py-2 text-sm text-klein font-body outline-none focus:border-klein focus:ring-1 focus:ring-klein transition-all">
            </div>

            <div class="h-px bg-klein/10 w-full my-2"></div>

            <!-- Filter Groups -->
            <div class="flex flex-col gap-5" id="filters-container">
                <!-- Dept -->
                <div>
                    <h3 class="font-mono font-bold text-xs uppercase tracking-wider text-klein mb-3">科系 (Department)</h3>
                    <div class="flex flex-col gap-2" id="filter-dept">
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm font-bold"><input type="radio" name="dept" value="all" checked class="accent-klein w-4 h-4"> 全部</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="dept" value="資工系" class="accent-klein w-4 h-4"> 資工系</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="dept" value="資管系" class="accent-klein w-4 h-4"> 資管系</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="dept" value="人工智慧系" class="accent-klein w-4 h-4"> 人工智慧系</label>
                    </div>
                </div>

                <!-- Type -->
                <div>
                    <h3 class="font-mono font-bold text-xs uppercase tracking-wider text-klein mb-3">修別 (Type)</h3>
                    <div class="flex flex-col gap-2" id="filter-type">
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm font-bold"><input type="radio" name="type" value="all" checked class="accent-klein w-4 h-4"> 全部</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="type" value="必修" class="accent-klein w-4 h-4"> 必修</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="type" value="選修" class="accent-klein w-4 h-4"> 選修</label>
                    </div>
                </div>

                <!-- Grade -->
                <div>
                    <h3 class="font-mono font-bold text-xs uppercase tracking-wider text-klein mb-3">年級 (Grade)</h3>
                    <div class="flex flex-col gap-2" id="filter-grade">
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm font-bold"><input type="radio" name="grade" value="all" checked class="accent-klein w-4 h-4"> 全部</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="grade" value="大一" class="accent-klein w-4 h-4"> 大一</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="grade" value="大二" class="accent-klein w-4 h-4"> 大二</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="grade" value="大三" class="accent-klein w-4 h-4"> 大三</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="grade" value="大四" class="accent-klein w-4 h-4"> 大四</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="grade" value="碩士" class="accent-klein w-4 h-4"> 碩士</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="grade" value="其他" class="accent-klein w-4 h-4"> 其他</label>
                    </div>
                </div>
                
                <!-- Credits -->
                <div>
                    <h3 class="font-mono font-bold text-xs uppercase tracking-wider text-klein mb-3">學分 (Credits)</h3>
                    <div class="flex flex-col gap-2" id="filter-credits">
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm font-bold"><input type="radio" name="credits" value="all" checked class="accent-klein w-4 h-4"> 全部</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="credits" value="1" class="accent-klein w-4 h-4"> 1 學分</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="credits" value="2" class="accent-klein w-4 h-4"> 2 學分</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="credits" value="3" class="accent-klein w-4 h-4"> 3 學分</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="credits" value="4" class="accent-klein w-4 h-4"> 4 學分</label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-klein text-klein/70 transition-colors text-sm"><input type="radio" name="credits" value="0" class="accent-klein w-4 h-4"> 0 學分</label>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Course List -->
        <div class="flex-1">
            <div class="flex items-center justify-between mb-6">
                <h2 class="font-heading font-black text-xl sm:text-2xl text-klein uppercase tracking-tight">所有課程 <span id="course-count" class="text-sm text-klein/50 ml-2 font-mono">(0)</span></h2>
                <button onclick="window.app.resetFilters()" class="text-xs font-mono font-bold uppercase tracking-wider text-klein/60 hover:text-klein underline transition-colors">清除條件</button>
            </div>
            
            <div id="course-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Courses dynamically rendered here -->
            </div>
            
            <div id="no-results" class="hidden py-12 text-center border border-dashed border-klein/20 bg-klein/[0.02]">
                <i class="fa-solid fa-folder-open text-4xl text-klein/20 mb-3"></i>
                <h3 class="font-heading font-bold text-lg text-klein">找不到符合的課程</h3>
                <p class="text-sm text-klein/60 mt-1">請嘗試調整左側的篩選條件。</p>
            </div>
        </div>
    </main>

    <!-- Course Detail Modal -->
    <div id="course-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-klein/20 backdrop-blur-sm transition-opacity opacity-0" id="modal-backdrop" onclick="window.app.closeModal()"></div>
        <div class="absolute inset-y-0 right-0 w-full max-w-2xl bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-out flex flex-col" id="modal-panel">
            
            <!-- Modal Header -->
            <div class="p-6 sm:p-8 border-b border-klein/10 shrink-0 relative bg-gray-50/50">
                <button onclick="window.app.closeModal()" class="absolute top-6 right-6 w-8 h-8 flex items-center justify-center text-klein/50 hover:text-klein bg-white border border-klein/10 hover:border-klein/30 rounded-full transition-all">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div class="flex gap-2 mb-3">
                    <span id="modal-type" class="text-[10px] font-mono font-bold tracking-wider px-2 py-0.5 uppercase bg-klein text-white border border-klein">必修</span>
                    <span id="modal-dept" class="text-[10px] font-mono font-bold tracking-wider px-2 py-0.5 uppercase bg-white text-klein border border-klein/30">資工系</span>
                </div>
                <h2 id="modal-title" class="font-heading font-black text-2xl sm:text-3xl text-klein mb-4">課程名稱</h2>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs font-mono">
                    <div>
                        <p class="text-klein/50 font-bold mb-1 uppercase tracking-wider">開課班級</p>
                        <p id="modal-classes" class="text-klein font-semibold"></p>
                    </div>
                    <div>
                        <p class="text-klein/50 font-bold mb-1 uppercase tracking-wider">授課教師</p>
                        <p id="modal-teacher" class="text-klein font-semibold"></p>
                    </div>
                    <div>
                        <p class="text-klein/50 font-bold mb-1 uppercase tracking-wider">學分</p>
                        <p id="modal-credits" class="text-klein font-semibold"></p>
                    </div>
                    <div>
                        <p class="text-klein/50 font-bold mb-1 uppercase tracking-wider">時間地點</p>
                        <p id="modal-time" class="text-klein font-semibold"></p>
                    </div>
                </div>
            </div>

            <!-- Modal Body (Syllabus) -->
            <div class="p-6 sm:p-8 flex-1 overflow-y-auto prose-klein font-body text-sm" id="modal-content">
                <!-- Markdown Content Injected Here -->
            </div>
            
        </div>
    </div>

    <script>
        window.app = {
            state: {
                search: "",
                dept: "all",
                type: "all",
                grade: "all",
                credits: "all"
            },

            init() {
                // Parse URL Parameters
                const urlParams = new URLSearchParams(window.location.search);
                const searchParam = urlParams.get('search');
                if (searchParam) {
                    this.state.search = searchParam.toLowerCase();
                    document.getElementById('search-input').value = searchParam;
                }

                // Initialize events
                document.getElementById('search-input').addEventListener('input', (e) => {
                    this.state.search = e.target.value.toLowerCase();
                    this.renderCourses();
                });

                const radios = document.querySelectorAll('input[type="radio"]');
                radios.forEach(r => {
                    r.addEventListener('change', (e) => {
                        this.state[e.target.name] = e.target.value;
                        // update label boldness
                        document.querySelectorAll(`input[name="${e.target.name}"]`).forEach(inp => {
                            if (inp.checked) {
                                inp.parentElement.classList.add('font-bold');
                            } else {
                                inp.parentElement.classList.remove('font-bold');
                            }
                        });
                        this.renderCourses();
                    });
                });

                this.renderCourses();
            },

            resetFilters() {
                this.state = {
                    search: "",
                    dept: "all",
                    type: "all",
                    grade: "all",
                    credits: "all"
                };
                document.getElementById('search-input').value = "";
                
                ['dept', 'type', 'grade', 'credits'].forEach(key => {
                    const radios = document.querySelectorAll(`input[name="${key}"]`);
                    radios.forEach(r => {
                        r.checked = r.value === 'all';
                        if(r.checked) r.parentElement.classList.add('font-bold');
                        else r.parentElement.classList.remove('font-bold');
                    });
                });
                this.renderCourses();
            },

            openCourse(id) {
                const course = window.COURSES_DATA.find(c => c.id === id);
                if(!course) return;

                document.getElementById('modal-title').innerText = course.title;
                document.getElementById('modal-classes').innerText = course.classes || '-';
                document.getElementById('modal-teacher').innerText = course.teacher || '-';
                document.getElementById('modal-credits').innerText = course.credits + ' 學分';
                document.getElementById('modal-time').innerText = course.time_loc || '-';
                
                const typeEl = document.getElementById('modal-type');
                typeEl.innerText = course.type;
                if(course.type === '必修') {
                    typeEl.className = 'text-[10px] font-mono font-bold tracking-wider px-2 py-0.5 uppercase bg-klein text-white border border-klein';
                } else {
                    typeEl.className = 'text-[10px] font-mono font-bold tracking-wider px-2 py-0.5 uppercase bg-white text-klein border border-klein/30';
                }
                document.getElementById('modal-dept').innerText = course.department;

                document.getElementById('modal-content').innerHTML = marked.parse(course.syllabus || '尚無詳細課綱資料。');

                const modal = document.getElementById('course-modal');
                const backdrop = document.getElementById('modal-backdrop');
                const panel = document.getElementById('modal-panel');
                
                modal.classList.remove('hidden');
                // Trigger reflow
                void modal.offsetWidth;
                backdrop.classList.remove('opacity-0');
                backdrop.classList.add('opacity-100');
                panel.classList.remove('translate-x-full');
                panel.classList.add('translate-x-0');
                
                document.body.style.overflow = 'hidden';
            },

            closeModal() {
                const backdrop = document.getElementById('modal-backdrop');
                const panel = document.getElementById('modal-panel');
                
                backdrop.classList.remove('opacity-100');
                backdrop.classList.add('opacity-0');
                panel.classList.remove('translate-x-0');
                panel.classList.add('translate-x-full');
                
                setTimeout(() => {
                    document.getElementById('course-modal').classList.add('hidden');
                    document.body.style.overflow = '';
                }, 300);
            },

            renderCourses() {
                const grid = document.getElementById('course-grid');
                const noResults = document.getElementById('no-results');
                const countEl = document.getElementById('course-count');

                let filtered = window.COURSES_DATA.filter(c => {
                    if (this.state.search && !c.title.toLowerCase().includes(this.state.search) && !(c.teacher && c.teacher.toLowerCase().includes(this.state.search))) return false;
                    if (this.state.dept !== 'all' && c.department !== this.state.dept) return false;
                    if (this.state.type !== 'all' && c.type !== this.state.type) return false;
                    if (this.state.grade !== 'all' && c.grade !== this.state.grade) return false;
                    if (this.state.credits !== 'all' && c.credits.toString() !== this.state.credits) return false;
                    return true;
                });

                countEl.innerText = `(${filtered.length})`;

                if (filtered.length === 0) {
                    grid.innerHTML = '';
                    noResults.classList.remove('hidden');
                } else {
                    noResults.classList.add('hidden');
                    grid.innerHTML = filtered.map(c => {
                        const typeColor = c.type === '必修' ? 'bg-klein text-white border-klein' : 'bg-white text-klein border-klein/30';
                        return `
                            <div class="course-card bg-white p-5 flex flex-col justify-between group h-full" onclick="window.app.openCourse('${c.id}')">
                                <div>
                                    <div class="flex justify-between items-start mb-3">
                                        <span class="text-[10px] font-mono font-bold tracking-wider px-2 py-0.5 uppercase ${typeColor}">${c.type}</span>
                                        <span class="text-[10px] font-mono font-bold tracking-wider px-2 py-0.5 uppercase bg-gray-100 text-gray-600 border border-gray-200">${c.department}</span>
                                    </div>
                                    <h3 class="font-heading font-black text-lg text-klein mb-1 leading-tight group-hover:text-blue-700 transition-colors">${c.title}</h3>
                                    <p class="text-xs font-body text-klein/60 mb-4 h-[3em] line-clamp-2 leading-relaxed">
                                        ${c.classes ? `開課班級: ${c.classes}<br>` : ''}
                                        ${c.teacher ? `教師: ${c.teacher}` : ''}
                                    </p>
                                </div>
                                <div class="flex items-center gap-3 pt-3 border-t border-klein/10 mt-auto">
                                    <div class="flex items-center gap-1.5 text-xs font-mono font-bold text-klein/70">
                                        <i class="fa-solid fa-graduation-cap text-klein/40"></i> ${c.grade}
                                    </div>
                                    <div class="w-px h-3 bg-klein/20"></div>
                                    <div class="flex items-center gap-1.5 text-xs font-mono font-bold text-klein/70">
                                        <i class="fa-solid fa-star text-klein/40"></i> ${c.credits} 學分
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            window.app.init();
        });
    </script>
</body>
</html>
